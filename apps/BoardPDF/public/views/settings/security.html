<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="settings-wrapper">
<div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="settings-scrollable">
<div class="component-layout" data-ref="settings-layout">
<div class="component-header" data-ref="settings-header">
<h1 class="component-title" data-ref="settings-title" data-i18n="settings.security.title"></h1>
<p class="component-subtitle" data-ref="settings-subtitle" data-i18n="settings.security.subtitle"></p>
</div>
<div class="banner banner--info" data-ref="protected-account-banner" class="is-hidden">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#shield"></use></svg>
<div class="banner__text" >
<strong data-i18n="settings.security.account_protected_banner_title"></strong>
<span data-i18n="settings.security.account_protected_banner_desc"></span>
</div>
</div>
<div class="component-group" data-ref="group-auth-methods">
<div class="component-item" data-ref="item-password">
<div class="component-item__content" data-ref="item-password-content">
<div class="component-item__icon-box" data-ref="item-password-icon-box">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#lock"></use></svg>
</div>
<div class="component-item__text" data-ref="item-password-text">
<h2 class="component-item__title" data-ref="item-password-title" data-i18n="settings.security.password_title"></h2>
<p class="component-item__desc" data-ref="item-password-desc" data-i18n="settings.security.password_desc"></p>
</div>
</div>
<div class="component-item__actions" data-ref="item-password-actions">
<button type="button" class="component-button component-button--h34" data-ref="btn-change-password" data-i18n="settings.security.btn_change_password"></button>
</div>
</div>
<hr class="component-divider" />
<div class="component-item" data-ref="item-2fa">
<div class="component-item__content" data-ref="item-2fa-content">
<div class="component-item__icon-box" data-ref="item-2fa-icon-box">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#shield"></use></svg>
</div>
<div class="component-item__text" data-ref="item-2fa-text">
<h2 class="component-item__title" data-ref="item-2fa-title" data-i18n="settings.security.two_factor_title"></h2>
<p class="component-item__desc" data-ref="item-2fa-desc" data-i18n="settings.security.two_factor_desc"></p>
</div>
</div>
<div class="component-item__actions" data-ref="item-2fa-actions">
<button type="button" class="component-button component-button--h34" data-ref="btn-configure-2fa" data-i18n="settings.security.btn_configure_2fa"></button>
</div>
</div>
</div>
<div class="component-group" data-ref="group-danger-zone">
<div class="component-item" data-ref="item-delete-account">
<div class="component-item__content" data-ref="item-delete-account-content">
<div class="component-item__text" data-ref="item-delete-account-text">
<h2 class="component-item__title" data-ref="item-delete-account-title" data-i18n="settings.security.delete_account_title"></h2>
<p class="component-item__desc" data-ref="item-delete-account-desc" data-i18n="settings.security.delete_account_desc"></p>
</div>
</div>
<div class="component-item__actions" data-ref="item-delete-account-actions">
<button type="button" class="component-button component-button--h34 component-button--danger" data-ref="btn-delete-account" data-i18n="settings.security.btn_delete_account"></button>
</div>
</div>
</div>
</div>
</div>
</div>
