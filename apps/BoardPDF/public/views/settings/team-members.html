<div class="component-wrapper component-wrapper--full view-wrapper component-view-layout" data-ref="team-members-wrapper">
  <div class="component-view-layout__body" data-ref="team-members-body">
    <div class="component-block" data-ref="team-members-card">
      <div class="component-block__header" data-ref="team-members-header">
        <div class="team-members-header__left" data-ref="team-members-header-left">
          <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-back-team" data-i18n-aria="settings.team.btn_back_team" data-i18n-title="settings.team.btn_back_team">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_back"></use></svg>
          </button>
          <div class="component-title-badge" data-ref="team-members-title-badge">
            <h1 class="component-title-badge__text" data-ref="team-members-title" data-i18n="settings.team.members_page_title"></h1>
          </div>
          <span class="component-badge component-badge--sm component-badge--neutral is-hidden" data-ref="team-members-summary-badge"></span>
        </div>

        <div class="component-block__actions" data-ref="team-members-header-actions">
          <button type="button" class="component-button component-button--h40 is-hidden" data-ref="btn-row-toggle-role">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#verified_user"></use></svg>
            <span data-ref="btn-row-toggle-role-text"></span>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--danger is-hidden" data-ref="btn-row-remove-member">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
            <span data-i18n="settings.team.btn_remove_member"></span>
          </button>
          <button type="button" class="component-button component-button--h40 is-hidden" data-ref="btn-row-copy-invite">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#content_copy"></use></svg>
            <span data-i18n="settings.team.btn_copy_invite_link"></span>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--danger is-hidden" data-ref="btn-row-revoke-invite">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
            <span data-i18n="settings.team.btn_revoke_invite"></span>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--black is-hidden" data-ref="btn-members-invite">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#mail"></use></svg>
            <span data-i18n="settings.team.btn_send_invite"></span>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-toggle-search" data-i18n-aria="common.search">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>
        </div>
      </div>

      <div class="component-floating-search is-hidden" data-ref="team-members-search-toolbar">
        <div class="component-floating-search__inner" data-ref="team-members-search-inner">
          <div class="component-search component-search--floating" data-ref="search-box">
            <div class="component-search__icon" data-ref="search-icon">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            </div>
            <div class="component-search__input-box" data-ref="search-input-box">
              <input class="component-search__input" data-ref="team-members-search-input" data-i18n-placeholder="settings.team.members_search_placeholder" type="text" placeholder=" " maxlength="120" autocomplete="off" />
            </div>
            <button type="button" class="component-button component-button--h34 component-button--icon-only is-hidden" data-ref="btn-clear-search" data-i18n-aria="common.clear_search">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="component-block__scrollable layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="team-members-scrollable">
        <div class="component-table-wrapper" data-ref="team-members-table-wrapper">
          <table class="component-table" data-ref="team-members-table">
            <thead class="component-table__head" data-ref="team-members-thead">
              <tr>
                <th class="component-table__cell--pl20" data-ref="th-member" data-i18n="settings.team.col_member"></th>
                <th data-ref="th-email" data-i18n="settings.team.col_email"></th>
                <th data-ref="th-role" data-i18n="settings.team.col_role"></th>
                <th data-ref="th-status" data-i18n="settings.team.col_status"></th>
                <th class="component-table__cell--pr20" data-ref="th-date" data-i18n="settings.team.col_date"></th>
              </tr>
            </thead>
            <tbody class="component-table__body" data-ref="team-members-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
