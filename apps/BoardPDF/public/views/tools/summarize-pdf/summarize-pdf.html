<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="summarize-pdf-wrapper">
  <div class="component-bottom tool-bottom tool-bottom--viewer tool-layout tool-layout--viewer" data-ref="summarize-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--viewer" data-ref="summarize-pdf-workspace">
      <input class="pdf-dropzone__input" data-ref="input-pdf-file" type="file" accept="application/pdf,.pdf" />

      <div class="tool-workspace__canvas" data-ref="summarize-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="summarize-dropzone">
          <h1 class="tool-hero-dropzone__title">Resumir PDF</h1>
          <p class="tool-hero-dropzone__desc">Lee, comprende y sintetiza cualquier documento PDF con inteligencia artificial.</p>

          <div class="tool-hero-dropzone__actions">
            <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-browse-file">
              <span>Seleccionar Archivo PDF</span>
            </button>
            <div class="tool-hero-dropzone__cloud-btns">
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-drive" data-tooltip="Google Drive" aria-label="Google Drive">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-dropbox" data-tooltip="Dropbox" aria-label="Dropbox">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              </button>
            </div>
          </div>

          <p class="tool-hero-dropzone__hint">o arrastra y suelta el PDF aquí</p>
        </div>
      </div>

      <div class="pdf-viewer-workspace is-hidden" data-ref="summarize-viewer-card">
        <div class="pdf-viewer-main-layout">
          <div class="pdf-viewer-canvas-container" data-ref="viewer-scroll-container">
            <div class="pdf-viewer-pages-wrapper" data-ref="pages-wrapper"></div>
          </div>
        </div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop" data-ref="tool-sidebar-backdrop"></div>

    <aside class="tool-layout__sidebar is-hidden" data-ref="summarize-pdf-sidebar">
      <div class="tool-sidebar__mobile-bar">
        <div class="modal-card__drag-zone" data-ref="summarize-sidebar-drag-zone">
          <div class="modal-card__drag-handle"></div>
        </div>
        <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" aria-label="Cerrar opciones">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
        </button>
      </div>

      <div class="tool-sidebar__header">
        <h1 class="tool-sidebar__title">Resumen con IA</h1>
        <p class="tool-sidebar__subtitle">Puntos clave, ideas principales y conclusiones generadas por inteligencia artificial.</p>
      </div>

      <div class="tool-sidebar__body tool-sidebar__body--chat" data-ref="summarize-sidebar-body">
        <div class="ai-summary-result-panel ai-summary-result-panel--full is-hidden" data-ref="section-summary-result">
          <div class="ai-summary-content" data-ref="summary-rendered-text"></div>
        </div>
      </div>
    </aside>
  </div>
</div>
