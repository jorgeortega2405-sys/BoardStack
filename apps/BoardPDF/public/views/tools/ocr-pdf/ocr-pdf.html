<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="ocr-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>
    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" data-i18n-placeholder="common.document_name_placeholder" type="text" placeholder=" " value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-i18n-tooltip="tools.ocr_pdf_options" data-i18n-aria="tools.ocr_pdf_options">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
        <span class="component-button__text" data-i18n="common.options"></span>
      </button>
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-ocr-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#center_focus_strong"></use></svg>
        <span class="component-button__text" data-ref="txt-ocr-action" data-i18n="tools.ocr_pdf_action"></span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="ocr-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="ocr-pdf-workspace">
      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="ocr-workspace-card">
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#center_focus_strong"></use></svg>
          <span data-i18n="tools.ocr_pdf_hint"></span>
        </div>
        <div class="pdf-items-grid" data-ref="pdf-items-grid">
          <div class="pdf-card">
            <div class="pdf-card__actions">
              <button type="button" class="component-button pdf-card__btn-remove" data-ref="btn-remove-file" data-i18n-title="common.delete_file" data-i18n-aria="common.delete_file">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>
            <div class="pdf-card__sheet-wrapper">
              <div class="pdf-card__sheet">
                <canvas class="pdf-card__canvas" data-ref="ocr-doc-canvas"></canvas>
              </div>
            </div>
            <span class="pdf-card__filename" data-ref="txt-file-name"></span>
            <span class="pdf-card__meta" data-ref="txt-file-size"></span>
          </div>
        </div>
        <div class="banner banner--danger is-hidden" data-ref="ocr-global-error" role="alert"></div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>
    <div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
      <aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="ocr-pdf-sidebar">
        <div class="menu-panel__drag-zone" data-ref="ocr-sidebar-drag-zone" aria-hidden="true">
          <div class="menu-panel__drag-handle"></div>
        </div>
        <div class="tool-sidebar__header">
          <div class="component-title-badge" data-ref="ocr-sidebar-title-badge">
            <h1 class="component-title-badge__text" data-ref="ocr-sidebar-title" data-i18n="tools.ocr_pdf_options"></h1>
          </div>
          <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>

        <div class="tool-sidebar__body">
          <div class="tool-sidebar__section">
            <span class="tool-sidebar__section-title" data-i18n="tools.ocr_doc_language"></span>
            <div class="settings-dropdown-wrapper settings-dropdown-wrapper--full" data-ref="dropdown-wrapper-ocr-language">
              <button type="button" class="dropdown-trigger" data-ref="btn-trigger-ocr-language" data-i18n-aria="aria.select_language">
                <div class="dropdown-trigger__left" data-ref="dropdown-trigger-left-ocr-language">
                  <svg class="component-icon dropdown-trigger__icon" data-ref="icon-ocr-language" aria-hidden="true"><use href="/icons.svg#language"></use></svg>
                  <span class="dropdown-trigger__text" data-ref="ocr-language-selected-text"></span>
                </div>
                <svg class="component-icon dropdown-trigger__chevron" data-ref="icon-ocr-chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
              </button>
              <div class="dropdown-backdrop" data-ref="dropdown-backdrop-ocr-language">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="dropdown-menu-ocr-language">
                  <div class="menu-panel__drag-zone" data-ref="drag-zone-ocr-language" aria-hidden="true">
                    <div class="menu-panel__drag-handle" data-ref="drag-handle-ocr-language"></div>
                  </div>
                  <div class="menu-panel__search" data-ref="search-wrapper-ocr-language">
                    <svg class="component-icon menu-panel__search-icon" data-ref="search-icon-ocr-language" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
                    <input class="menu-panel__search-input" data-ref="input-search-ocr-language" data-i18n-placeholder="common.search_language_placeholder" type="text" placeholder=" " maxlength="50" autocomplete="off" />
                  </div>
                  <div class="menu-panel__list menu-panel__list--scrollable" data-ref="list-ocr-languages"></div>
                  <div class="menu-panel__empty is-hidden" data-ref="empty-ocr-languages" data-i18n="tools.ocr_no_languages_found"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
