<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="ocr-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>

    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" placeholder="Nombre del documento" value="" autocomplete="off" />
      <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-options">
        <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-tooltip="Opciones" aria-label="Opciones">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
          <span class="component-button__text">Opciones</span>
        </button>
        <div class="dropdown-backdrop" data-ref="dropdown-backdrop-options"></div>
        <div class="menu-panel menu-panel--dropdown tool-options-popover" data-ref="dropdown-menu-options">
          <div class="menu-panel__list">
            <div class="settings-dropdown-wrapper settings-dropdown-wrapper--full" data-ref="dropdown-wrapper-ocr-language">
              <button type="button" class="dropdown-trigger" data-ref="btn-trigger-ocr-language" aria-label="Seleccionar idioma">
                <div class="dropdown-trigger__left" data-ref="dropdown-trigger-left-ocr-language">
                  <svg class="component-icon dropdown-trigger__icon" data-ref="icon-ocr-language" aria-hidden="true"><use href="/icons.svg#language"></use></svg>
                  <span class="dropdown-trigger__text" data-ref="ocr-language-selected-text">Español</span>
                </div>
                <svg class="component-icon dropdown-trigger__chevron" data-ref="icon-ocr-chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
              </button>

              <div class="dropdown-backdrop" data-ref="dropdown-backdrop-ocr-language">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="dropdown-menu-ocr-language">
                  <div class="menu-panel__drag-zone" data-ref="drag-zone-ocr-language" aria-hidden="true">
                    <div class="menu-panel__drag-handle" data-ref="drag-handle-ocr-language"></div>
                  </div>
                  <div class="menu-panel__search" data-ref="search-wrapper-ocr-language">
                    <svg class="component-icon menu-panel__search-icon" data-ref="search-icon-ocr-language" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
                    <input class="menu-panel__search-input" data-ref="input-search-ocr-language" type="text" placeholder="Buscar idioma..." maxlength="50" autocomplete="off" />
                  </div>
                  <div class="menu-panel__list menu-panel__list--scrollable" data-ref="list-ocr-languages"></div>
                  <div class="menu-panel__empty is-hidden" data-ref="empty-ocr-languages">No se encontraron idiomas</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-ocr-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#center_focus_strong"></use></svg>
        <span class="component-button__text" data-ref="txt-ocr-action">Reconocer Texto (OCR)</span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="ocr-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="ocr-pdf-workspace">
      <input class="pdf-dropzone__input" data-ref="input-pdf-file" type="file" accept="application/pdf,.pdf" />

      <div class="tool-workspace__canvas" data-ref="ocr-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="ocr-dropzone">
          <h1 class="tool-hero-dropzone__title">OCR PDF</h1>
          <p class="tool-hero-dropzone__desc">Convierte documentos PDF escaneados en archivos con texto seleccionable y editable.</p>

          <div class="tool-hero-dropzone__actions">
            <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-browse-file">
              <span>Seleccionar PDF</span>
            </button>
            <div class="tool-hero-dropzone__cloud-btns">
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-drive" data-tooltip="Google Drive" aria-label="Google Drive">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-dropbox" data-tooltip="Dropbox" aria-label="Dropbox">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              </button>
            </div>
          </div>

          <p class="tool-hero-dropzone__hint">o arrastra y suelta el PDF aquí</p>
        </div>
      </div>

      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="ocr-selected-card">

        <div class="pdf-reorder-hint">
          <span>Selecciona el idioma del texto para digitalizar y hacer seleccionable el contenido del PDF.</span>
        </div>

        <div class="pdf-items-grid" data-ref="pdf-items-grid">
          <div class="pdf-card">
            <div class="pdf-card__actions">
              <button type="button" class="component-button pdf-card__btn-remove" data-ref="btn-remove-file" title="Eliminar archivo" aria-label="Eliminar archivo">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>
            <div class="pdf-card__sheet-wrapper">
              <div class="pdf-card__sheet">
                <canvas class="pdf-card__canvas" data-ref="doc-preview-canvas"></canvas>
              </div>
            </div>
            <span class="pdf-card__filename" data-ref="selected-file-name">documento.pdf</span>
            <span class="pdf-card__meta" data-ref="selected-file-size">0 KB</span>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
