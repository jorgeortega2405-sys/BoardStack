<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="edit-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left">

      <div class="pdf-editor-top-controls pdf-top-controls is-hidden" data-ref="editor-top-controls">
        <div class="component-toggle-pill component-toggle-pill--glass" data-ref="toggle-editor-mode" data-active="0">
          <div class="component-toggle-pill-glider"></div>
          <button type="button" class="component-button component-button--rounded-pill is-active" data-ref="btn-mode-annotate" data-mode="annotate">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
            <span>Anotar</span>
          </button>
          <button type="button" class="component-button component-button--rounded-pill" data-ref="btn-mode-edit" data-mode="edit">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#format_color_text"></use></svg>
            <span>Editar</span>
          </button>
        </div>

        <div class="tool-top__divider"></div>

        <div class="pdf-editor-tools-group pdf-top-controls--gap4" data-ref="tools-group-annotate">
          <button type="button" class="component-button component-button--h40 component-button--icon-only is-active" data-ref="tool-select" data-tool="select" data-tooltip="Seleccionar elemento" aria-label="Seleccionar">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#near_me"></use></svg>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="tool-text" data-tool="text" data-tooltip="Añadir texto" aria-label="Texto">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#title"></use></svg>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="tool-shapes" data-tool="shapes" data-tooltip="Formas y figuras" aria-label="Formas">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#category"></use></svg>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="tool-image" data-tool="image" data-tooltip="Añadir imagen" aria-label="Imagen">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#image"></use></svg>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="tool-draw" data-tool="draw" data-tooltip="Dibujar a mano alzada" aria-label="Dibujar">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#brush"></use></svg>
          </button>
        </div>

        <div class="pdf-editor-tools-group is-hidden" data-ref="tools-group-edit">
          <div class="pdf-editor-status-pill pdf-editor-status-pill--success" data-ref="edit-status-pill">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#check_circle"></use></svg>
            <span class="pdf-editor-status-pill__text" data-ref="txt-edit-status">Texto editable: haz clic en cualquier línea para modificarla</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" placeholder="Nombre del documento" value="" autocomplete="off" />
      <div class="pdf-editor-top-actions pdf-top-controls is-hidden" data-ref="editor-top-actions">
        <button type="button" class="component-button component-button--h40 component-button--icon-only collaborative-top-icon-btn" data-ref="btn-undo" data-tooltip="Deshacer" aria-label="Deshacer" disabled>
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#undo"></use></svg>
        </button>
        <button type="button" class="component-button component-button--h40 component-button--icon-only collaborative-top-icon-btn" data-ref="btn-redo" data-tooltip="Rehacer" aria-label="Rehacer" disabled>
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#redo"></use></svg>
        </button>
      </div>

      <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-tooltip="Elementos añadidos" aria-label="Elementos añadidos">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#layers"></use></svg>
        <span class="component-button__text">Elementos</span>
      </button>

      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-sidebar-save-pdf">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#download"></use></svg>
        <span class="component-button__text">Guardar</span>
      </button>
    </div>
  </header>

  <div class="pdf-editor-subtoolbar is-hidden" data-ref="editor-subtoolbar">
    <div class="pdf-editor-subtoolbar__group is-hidden" data-ref="subtoolbar-shapes">
      <button type="button" class="component-button component-button--h36 component-button--icon-only is-active" data-ref="btn-sub-rect" data-shape="rect" data-tooltip="Rectángulo" aria-label="Rectángulo">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#crop_square"></use></svg>
      </button>
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-sub-circle" data-shape="circle" data-tooltip="Círculo" aria-label="Círculo">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#radio_button_unchecked"></use></svg>
      </button>
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-sub-line" data-shape="line" data-tooltip="Línea" aria-label="Línea">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#horizontal_rule"></use></svg>
      </button>

      <div class="pdf-editor-subtoolbar__divider"></div>

      <div class="pdf-editor-subtoolbar__group" data-ref="sub-shape-stroke-group">
        <span class="tool-sidebar__hint-text--compact">Borde:</span>
        <button type="button" class="pdf-editor-subtoolbar__color-trigger" data-ref="btn-trigger-stroke-color">
          <div class="pdf-editor-subtoolbar__color-preview" data-ref="preview-stroke-color" style="background-color: #000000;"></div>
        </button>
      </div>

      <div class="pdf-editor-subtoolbar__group" data-ref="sub-shape-fill-group">
        <span class="tool-sidebar__hint-text--compact">Relleno:</span>
        <button type="button" class="pdf-editor-subtoolbar__color-trigger" data-ref="btn-trigger-fill-color">
          <div class="pdf-editor-subtoolbar__color-preview" data-ref="preview-fill-color" style="background-color: transparent;"></div>
        </button>
      </div>
    </div>

    <div class="pdf-editor-subtoolbar__group is-hidden" data-ref="subtoolbar-text">
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-text-bold" data-tooltip="Negrita" aria-label="Negrita">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#format_bold"></use></svg>
      </button>
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-text-italic" data-tooltip="Cursiva" aria-label="Cursiva">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#format_italic"></use></svg>
      </button>
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-text-underline" data-tooltip="Subrayado" aria-label="Subrayado">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#format_underlined"></use></svg>
      </button>

      <div class="pdf-editor-subtoolbar__divider"></div>

      <div class="pdf-editor-subtoolbar__group">
        <span class="tool-sidebar__hint-text--compact">Color:</span>
        <button type="button" class="pdf-editor-subtoolbar__color-trigger" data-ref="btn-trigger-text-color">
          <div class="pdf-editor-subtoolbar__color-preview" data-ref="preview-text-color" style="background-color: #000000;"></div>
        </button>
      </div>
    </div>

    <div class="pdf-editor-subtoolbar__group is-hidden" data-ref="subtoolbar-draw">
      <div class="pdf-editor-subtoolbar__group">
        <span class="tool-sidebar__hint-text--compact">Color de trazo:</span>
        <button type="button" class="pdf-editor-subtoolbar__color-trigger" data-ref="btn-trigger-draw-color">
          <div class="pdf-editor-subtoolbar__color-preview" data-ref="preview-draw-color" style="background-color: #000000;"></div>
        </button>
      </div>
      <div class="pdf-editor-subtoolbar__group">
        <span class="tool-sidebar__hint-text--compact">Grosor:</span>
        <div class="pdf-stroke-options" data-ref="draw-stroke-options">
          <button type="button" class="pdf-stroke-btn" data-ref="stroke-1" data-width="1" aria-label="1 píxel">
            <span class="pdf-stroke-btn__line pdf-stroke-btn__line--1"></span>
          </button>
          <button type="button" class="pdf-stroke-btn is-active" data-ref="stroke-2" data-width="2" aria-label="2 píxeles">
            <span class="pdf-stroke-btn__line pdf-stroke-btn__line--2"></span>
          </button>
          <button type="button" class="pdf-stroke-btn" data-ref="stroke-4" data-width="4" aria-label="4 píxeles">
            <span class="pdf-stroke-btn__line pdf-stroke-btn__line--4"></span>
          </button>
          <button type="button" class="pdf-stroke-btn" data-ref="stroke-8" data-width="8" aria-label="8 píxeles">
            <span class="pdf-stroke-btn__line pdf-stroke-btn__line--8"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="component-bottom tool-bottom tool-bottom--viewer tool-layout tool-layout--viewer" data-ref="edit-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--viewer" data-ref="edit-pdf-workspace">
      <input class="pdf-dropzone__input" data-ref="input-image-file" type="file" accept="image/png,image/jpeg,image/webp" />

      <div class="pdf-viewer-workspace pdf-editor-workspace is-hidden" data-ref="edit-editor-card">
        <div class="pdf-viewer-main-layout pdf-editor-main-layout" data-ref="editor-main-layout">
          <aside class="pdf-viewer-pages-sidebar pdf-editor-pages-sidebar" data-ref="pages-sidebar">
            <div class="pdf-viewer-thumbnails-scroll pdf-editor-thumbnails-scroll" data-ref="thumbnails-container"></div>
          </aside>

          <div class="pdf-viewer-canvas-container pdf-editor-canvas-container" data-ref="editor-scroll-container">
            <div class="pdf-viewer-pages-wrapper pdf-editor-pages-wrapper" data-ref="pages-wrapper"></div>
          </div>
        </div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>

    <div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
      <aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="edit-pdf-sidebar">
      <div class="tool-sidebar__header">
        <div class="tool-sidebar__header-left">
          <svg class="component-icon tool-sidebar__header-icon" aria-hidden="true"><use href="/icons.svg#layers"></use></svg>
          <h2 class="tool-sidebar__title">Elementos</h2>
        </div>
        <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close" aria-label="Cerrar">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
        </button>
      </div>

      <div class="tool-sidebar__body">
        <div class="tool-sidebar__section">
          <div class="pdf-editor-elements-container" data-ref="elements-container">
            <div class="pdf-editor-elements-header is-hidden" data-ref="elements-header">
              <span class="pdf-editor-elements-title" data-ref="txt-elements-count">Elementos añadidos</span>
              <button type="button" class="component-button component-button--ghost component-button--danger component-button--sm" data-ref="btn-clear-all-elements">Eliminar todos</button>
            </div>
            <div class="pdf-editor-elements-list" data-ref="elements-list"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
  </div>

  <footer class="tool-footer collaborative-footer is-hidden" data-ref="tool-footer">
    <div class="collaborative-footer__right" data-ref="footer-right">
      <span class="collaborative-footer__page-text" data-ref="txt-footer-page-info">1 de 1</span>
      <div class="collaborative-footer__divider"></div>
      <input class="collaborative-zoom-slider" data-ref="slider-zoom" type="range" min="10" max="300" step="1" value="100" aria-label="Nivel de zoom" />
      <button type="button" class="collaborative-zoom-level-btn" data-ref="btn-zoom-reset" data-tooltip="Restablecer zoom" aria-label="Restablecer zoom">
        <span data-ref="txt-zoom-level">100%</span>
      </button>
    </div>
  </footer>
</div>
