<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="redact-pdf-wrapper">
<header class="component-top tool-top-bar is-hidden" data-ref="component-top">
<div class="tool-top-bar__left" data-ref="tool-top-left">
<div class="redact-top-controls pdf-top-controls is-hidden" data-ref="redact-top-controls">
<div class="component-tabs component-tabs--glass" data-ref="toggle-redact-tool" data-active="0">
<button type="button" class="component-tab is-active" data-ref="btn-tool-select" data-tool="select">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#format_color_text"></use></svg>
<span>Seleccionar texto</span>
</button>
<button type="button" class="component-tab" data-ref="btn-tool-draw" data-tool="draw">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#crop_square"></use></svg>
<span>Dibujar área</span>
</button>
</div>
</div>
</div>
<div class="tool-top-bar__right" data-ref="tool-top-right">
<input class="collaborative-title-input" data-ref="input-doc-title" type="text" data-i18n-placeholder="common.document_name_placeholder" placeholder=" " value="" autocomplete="off" />
<button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-tooltip="Opciones de censura" aria-label="Opciones de censura">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
<span class="component-button__text" >Censuras</span>
</button>
<button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-execute-redact" disabled>
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#security"></use></svg>
<span class="component-button__text" >Aplicar Censuras</span>
</button>
</div>
</header>
<div class="component-bottom tool-bottom tool-bottom--viewer tool-layout tool-layout--viewer" data-ref="redact-pdf-layout">
<main class="tool-layout__workspace tool-layout__workspace--viewer" data-ref="redact-pdf-workspace">
<div class="pdf-viewer-workspace pdf-editor-workspace redact-editor-workspace is-hidden" data-ref="redact-workspace-card">
<div class="pdf-viewer-main-layout pdf-editor-main-layout" >
<aside class="pdf-viewer-pages-sidebar pdf-editor-pages-sidebar redact-pages-sidebar" >
<div class="pdf-viewer-thumbnails-scroll pdf-editor-thumbnails-scroll" data-ref="thumbnails-container"></div>
</aside>
<div class="pdf-viewer-canvas-container pdf-editor-canvas-container redact-canvas-container" >
<div class="pdf-viewer-pages-wrapper pdf-editor-pages-wrapper" data-ref="pages-wrapper"></div>
</div>
</div>
</div>
</main>
<div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>
<div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
<aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="redact-pdf-sidebar">
<div class="tool-sidebar__header">
  <h2 class="tool-sidebar__title" data-i18n="tools.redact_pdf_options"></h2>
  <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close" aria-label="Cerrar">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
</button>
</div>
<div class="tool-sidebar__body" >
<div class="tool-sidebar__section" >
<div class="redact-search-box" >
<label class="field" >
<input class="field__input field__input--has-action" data-ref="input-search-phrase" type="text" placeholder=" " autocomplete="off" />
<span class="field__label" >Palabra o frase confidencial</span>
<button type="button" class="field__action" data-ref="btn-search-redact" data-tooltip="Buscar y censurar" data-i18n-aria="aria.search_redact" aria-label="Buscar y censurar">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
</button>
</label>
</div>
</div>
<div class="tool-sidebar__section" >
<span class="tool-sidebar__section-title" >Elementos a censurar</span>
<div class="redact-items-list" data-ref="redactions-list-container">
<p class="redact-items-list__empty" >No has añadido ninguna censura todavía. Selecciona texto en el documento o dibuja un área.</p>
</div>
</div>
</div>
</aside>
</div>
</div>
<footer class="tool-footer collaborative-footer is-hidden" data-ref="tool-footer">
<div class="collaborative-footer__right" data-ref="footer-right">
<span class="collaborative-footer__page-text" data-ref="txt-footer-page-info">1 de 1</span>
<div class="collaborative-footer__divider" ></div>
<input class="collaborative-zoom-slider" data-ref="slider-zoom" type="range" min="10" max="300" step="1" value="100" aria-label="Nivel de zoom" />
<button type="button" class="collaborative-zoom-level-btn" data-ref="btn-zoom-reset" data-tooltip="Restablecer zoom" aria-label="Restablecer zoom">
<span data-ref="txt-zoom-level">100%</span>
</button>
</div>
</footer>
</div>
