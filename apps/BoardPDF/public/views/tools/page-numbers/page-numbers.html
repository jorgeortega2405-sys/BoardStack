<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="page-numbers-wrapper">
<header class="component-top tool-top-bar is-hidden" data-ref="component-top">
<div class="tool-top-bar__left" data-ref="tool-top-left"></div>
<div class="tool-top-bar__right" data-ref="tool-top-right">
<input class="collaborative-title-input" data-ref="input-doc-title" type="text" data-i18n-placeholder="common.document_name_placeholder" placeholder=" " value="" autocomplete="off" />
<button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-tooltip="Opciones" aria-label="Opciones">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
<span class="component-button__text" >Opciones</span>
</button>
<button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-execute-page-numbers" disabled>
<svg class="component-icon component-button__icon-left" aria-hidden="true"><use href="/icons.svg#format_list_numbered"></use></svg>
<span class="component-button__text" data-ref="txt-execute-page-numbers">Insertar números de página</span>
</button>
</div>
</header>
<div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="page-numbers-layout">
<main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="page-numbers-workspace">
<div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="pn-workspace-card">
<div class="pdf-reorder-hint" >
<span>Personaliza la posición, márgenes y formato de los números de página en el panel de opciones.</span>
</div>
<div class="pdf-items-grid pn-pages-grid" data-ref="pn-pages-grid"></div>
</div>
</main>
<div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>
<div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
<aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="page-numbers-sidebar">
<div class="tool-sidebar__header">
  <h2 class="tool-sidebar__title" data-i18n="tools.page_numbers_options"></h2>
  <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close" aria-label="Cerrar">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
</button>
</div>
<div class="tool-sidebar__body" >
<div class="tool-sidebar__section" >
<span class="tool-sidebar__section-title" >Modo de página</span>
<div class="component-tabs" data-ref="toggle-page-mode" data-active="0">
<button type="button" class="component-tab is-active" data-ref="btn-mode-single" data-val="single" data-mode="single">Página única</button>
<button type="button" class="component-tab" data-ref="btn-mode-double" data-val="double" data-mode="double">Doble cara</button>
</div>
</div>
<label class="split-option-card tool-sidebar__field-group--mt10" data-ref="card-cover">
<div class="split-option-card__content" >
<span class="split-option-card__title" >La primera página es la portada</span>
<span class="split-option-card__subtitle" >No incluir número en la carátula</span>
</div>
<input class="component-checkbox" data-ref="check-cover" type="checkbox" />
</label>
<div class="tool-sidebar__section" >
<span class="tool-sidebar__section-title" >Posición en página</span>
<div class="pn-position-box" data-ref="pn-position-box">
<div class="pn-position-cell" data-ref="pos-cell-top-left" data-pos="top-left" title="Superior Izquierda"></div>
<div class="pn-position-cell" data-ref="pos-cell-top-center" data-pos="top-center" title="Superior Centro"></div>
<div class="pn-position-cell" data-ref="pos-cell-top-right" data-pos="top-right" title="Superior Derecha"></div>
<div class="pn-position-cell is-disabled" title="No disponible"></div>
<div class="pn-position-cell is-disabled" title="No disponible"></div>
<div class="pn-position-cell is-disabled" title="No disponible"></div>
<div class="pn-position-cell" data-ref="pos-cell-bottom-left" data-pos="bottom-left" title="Inferior Izquierda"></div>
<div class="pn-position-cell" data-ref="pos-cell-bottom-center" data-pos="bottom-center" title="Inferior Centro"></div>
<div class="pn-position-cell is-selected" data-ref="pos-cell-bottom-right" data-pos="bottom-right" title="Inferior Derecha"></div>
</div>
</div>
<div class="tool-sidebar__section" >
<span class="tool-sidebar__section-title" >Margen</span>
<div class="component-tabs" data-ref="toggle-margin" data-active="0">
<button type="button" class="component-tab is-active" data-ref="btn-margin-recommended" data-val="recommended">Recomendado</button>
<button type="button" class="component-tab" data-ref="btn-margin-small" data-val="small">Pequeño</button>
<button type="button" class="component-tab" data-ref="btn-margin-large" data-val="large">Grande</button>
</div>
</div>
<div class="tool-sidebar__row-between" >
<span class="tool-sidebar__hint-text" >Primer número:</span>
<div class="component-inline-control component-inline-control--compact component-inline-control--sm" >
<div class="component-inline-control__group" >
<button type="button" class="component-inline-control__btn" data-step-change="-1" data-i18n-aria="aria.decrease_first_number" aria-label="Disminuir primer número">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_left"></use></svg>
</button>
</div>
<input class="component-inline-control__input" data-ref="input-start-number" type="number" min="1" value="1" autocomplete="off" />
<div class="component-inline-control__group" >
<button type="button" class="component-inline-control__btn" data-step-change="1" data-i18n-aria="aria.increase_first_number" aria-label="Aumentar primer número">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_right"></use></svg>
</button>
</div>
</div>
</div>
<div class="pn-range-row" >
<span class="tool-sidebar__hint-text--compact" >De</span>
<div class="component-inline-control component-inline-control--compact component-inline-control--sm" >
<div class="component-inline-control__group" >
<button type="button" class="component-inline-control__btn" data-step-change="-1" data-i18n-aria="aria.decrease_start_page" aria-label="Disminuir página inicial">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_left"></use></svg>
</button>
</div>
<input class="component-inline-control__input" data-ref="input-from-page" type="number" min="1" value="1" autocomplete="off" />
<div class="component-inline-control__group" >
<button type="button" class="component-inline-control__btn" data-step-change="1" data-i18n-aria="aria.increase_start_page" aria-label="Aumentar página inicial">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_right"></use></svg>
</button>
</div>
</div>
<span class="tool-sidebar__hint-text--compact" >a</span>
<div class="component-inline-control component-inline-control--compact component-inline-control--sm" >
<div class="component-inline-control__group" >
<button type="button" class="component-inline-control__btn" data-step-change="-1" data-i18n-aria="aria.decrease_end_page" aria-label="Disminuir página final">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_left"></use></svg>
</button>
</div>
<input class="component-inline-control__input" data-ref="input-to-page" type="number" min="1" value="1" autocomplete="off" />
<div class="component-inline-control__group" >
<button type="button" class="component-inline-control__btn" data-step-change="1" data-i18n-aria="aria.increase_end_page" aria-label="Aumentar página final">
<svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_right"></use></svg>
</button>
</div>
</div>
</div>
<div class="settings-dropdown-wrapper settings-dropdown-wrapper--full tool-sidebar__field-group--mb8" data-ref="dropdown-wrapper-format">
<button type="button" class="dropdown-trigger dropdown-trigger--full" data-i18n-aria="aria.number_format" aria-label="Formato de numeración">
<div class="dropdown-trigger__left" >
<span class="dropdown-trigger__text" >Inserta solo números de página (recomendado)</span>
</div>
<svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
</button>
<div class="dropdown-backdrop" >
<div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" >
<div class="menu-panel__drag-zone" aria-hidden="true">
<div class="menu-panel__drag-handle" ></div>
</div>
<div class="menu-panel__list" >
<button type="button" class="menu-item is-active" data-value="{n}">
<span class="menu-item__text" >Inserta solo números de página (recomendado)</span>
</button>
<button type="button" class="menu-item" data-value="Página {n}">
<span class="menu-item__text" >Página {n}</span>
</button>
<button type="button" class="menu-item" data-value="Página {n} de {p}">
<span class="menu-item__text" >Página {n} de {p}</span>
</button>
<button type="button" class="menu-item" data-value="custom">
<span class="menu-item__text" >Personalizado</span>
</button>
</div>
</div>
</div>
</div>
<div class="pn-custom-text-box is-hidden" data-ref="box-custom-text">
<label class="field tool-sidebar__field-group--mb4" >
<input class="field__input field__input--h36" data-ref="input-custom-text" type="text" value="Página {n} de {p}" data-i18n-placeholder="common.page_number_format_placeholder" placeholder=" " />
</label>
</div>
<div class="tool-sidebar__field-group--flex-row" >
<div class="settings-dropdown-wrapper settings-dropdown-wrapper--full tool-sidebar__dropdown--nomargin tool-sidebar__flex-1" data-ref="dropdown-wrapper-font-family">
<button type="button" class="dropdown-trigger dropdown-trigger--full" data-i18n-aria="aria.font_family" aria-label="Familia tipográfica">
<div class="dropdown-trigger__left" >
<span class="dropdown-trigger__text" >Arial / Helvetica</span>
</div>
<svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
</button>
<div class="dropdown-backdrop" >
<div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" >
<div class="menu-panel__drag-zone" aria-hidden="true">
<div class="menu-panel__drag-handle" ></div>
</div>
<div class="menu-panel__list" >
<button type="button" class="menu-item is-active" data-value="Helvetica">
<span class="menu-item__text" >Arial / Helvetica</span>
</button>
<button type="button" class="menu-item" data-value="Helvetica-Bold">
<span class="menu-item__text" >Helvetica (Negrita)</span>
</button>
<button type="button" class="menu-item" data-value="Times-Roman">
<span class="menu-item__text" >Times New Roman</span>
</button>
<button type="button" class="menu-item" data-value="Courier">
<span class="menu-item__text" >Courier</span>
</button>
</div>
</div>
</div>
</div>
<div class="settings-dropdown-wrapper settings-dropdown-wrapper--full tool-sidebar__dropdown--w90" data-ref="dropdown-wrapper-font-size">
<button type="button" class="dropdown-trigger dropdown-trigger--full" data-i18n-aria="aria.font_size" aria-label="Tamaño tipográfico">
<div class="dropdown-trigger__left" >
<span class="dropdown-trigger__text" >11 pt</span>
</div>
<svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
</button>
<div class="dropdown-backdrop" >
<div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" >
<div class="menu-panel__drag-zone" aria-hidden="true">
<div class="menu-panel__drag-handle" ></div>
</div>
<div class="menu-panel__list" >
<button type="button" class="menu-item" data-value="9">
<span class="menu-item__text" >9 pt</span>
</button>
<button type="button" class="menu-item is-active" data-value="11">
<span class="menu-item__text" >11 pt</span>
</button>
<button type="button" class="menu-item" data-value="14">
<span class="menu-item__text" >14 pt</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
</aside>
</div>
</div>
</div>
