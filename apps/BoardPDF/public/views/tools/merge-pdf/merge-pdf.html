<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="pdf-merger-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>

    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" placeholder="Nombre del documento" value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-main-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#picture_as_pdf"></use></svg>
        <span class="component-button__text" data-ref="txt-main-action" data-i18n="tools.merge_pdf_btn_select">Unir PDF</span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="pdf-merger-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="pdf-merger-workspace">
      <input class="pdf-dropzone__input" data-ref="input-pdf-files" type="file" multiple accept="application/pdf,.pdf" />
      <input class="pdf-dropzone__input" data-ref="input-add-more-pdf" type="file" multiple accept="application/pdf,.pdf" />

      <div class="tool-workspace__canvas" data-ref="pdf-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="pdf-dropzone">
          <h1 class="tool-hero-dropzone__title" data-i18n="tools.merge_pdf_title">Unir archivos PDF</h1>
          <p class="tool-hero-dropzone__desc" data-i18n="tools.merge_pdf_subtitle">Une PDFs y ponlos en el orden que prefieras. ¡Rápido y fácil!</p>

          <div class="tool-hero-dropzone__actions">
            <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-browse-pdfs">
              <span data-i18n="tools.merge_pdf_btn_select">Seleccionar archivos PDF</span>
            </button>
            <div class="tool-hero-dropzone__cloud-btns">
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-drive" data-tooltip="Google Drive" aria-label="Google Drive">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-dropbox" data-tooltip="Dropbox" aria-label="Dropbox">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              </button>
            </div>
          </div>

          <p class="tool-hero-dropzone__hint">o arrastra y suelta los PDF aquí</p>
        </div>
      </div>

      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="pdf-items-card">

        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#swap_vert"></use></svg>
          <span>Arrastra y suelta las tarjetas para reorganizar el orden en que se unirán los PDFs.</span>
        </div>

        <div class="pdf-items-grid" data-ref="pdf-items-grid"></div>
      </div>
    </main>
  </div>
</div>
