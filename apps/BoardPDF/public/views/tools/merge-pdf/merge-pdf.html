<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="pdf-merger-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>
    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" data-i18n-placeholder="common.document_name_placeholder" type="text" placeholder=" " value="" autocomplete="off" />
      <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-add-files">
        <button type="button" class="component-button component-button--icon-only component-button--h40 collaborative-top-icon-btn" data-ref="btn-top-add-files" data-i18n-tooltip="common.add_files" data-i18n-aria="common.add_files">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
        </button>
        <div class="dropdown-backdrop" data-ref="dropdown-backdrop-add-files"></div>
        <div class="menu-panel menu-panel--dropdown menu-panel--w-220" data-ref="dropdown-menu-add-files">
          <div class="menu-panel__list">
            <button type="button" class="menu-item" data-ref="btn-menu-add-device">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#devices"></use></svg>
              <span class="menu-item__text" data-i18n="common.add_from_device"></span>
            </button>
            <button type="button" class="menu-item" data-ref="btn-menu-add-drive">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              <span class="menu-item__text" data-i18n="common.add_from_drive"></span>
            </button>
            <button type="button" class="menu-item" data-ref="btn-menu-add-dropbox">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              <span class="menu-item__text" data-i18n="common.add_from_dropbox"></span>
            </button>
          </div>
        </div>
      </div>
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-main-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#picture_as_pdf"></use></svg>
        <span class="component-button__text" data-ref="txt-main-action" data-i18n="tools.merge_pdf_btn_select"></span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="pdf-merger-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="pdf-merger-workspace">
      <input class="pdf-dropzone__input" data-ref="input-add-more-pdf" type="file" multiple accept="application/pdf,.pdf" />
      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="pdf-items-card">
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#swap_vert"></use></svg>
          <span data-i18n="tools.merge_pdf_reorder_hint"></span>
        </div>
        <div class="pdf-items-grid" data-ref="pdf-items-grid"></div>
        <div class="banner banner--danger is-hidden" data-ref="merge-global-error" role="alert"></div>
      </div>
    </main>
  </div>
</div>
