<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="crop-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>

    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" placeholder="Nombre del documento" value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-tooltip="Opciones de recorte" aria-label="Opciones de recorte">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
        <span class="component-button__text">Opciones</span>
      </button>

      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-execute-crop" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#crop"></use></svg>
        <span class="component-button__text" data-ref="txt-execute-crop">Recortar PDF</span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--viewer tool-layout tool-layout--viewer" data-ref="crop-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--viewer" data-ref="crop-pdf-workspace">
      <div class="pdf-viewer-workspace pdf-editor-workspace is-hidden" data-ref="crop-workspace-card">
        <div class="pdf-viewer-main-layout pdf-editor-main-layout" data-ref="crop-main-layout">
          <aside class="pdf-viewer-pages-sidebar pdf-editor-pages-sidebar" data-ref="crop-pages-sidebar">
            <div class="pdf-viewer-thumbnails-scroll pdf-editor-thumbnails-scroll" data-ref="crop-thumbnails-container"></div>
          </aside>

          <div class="pdf-viewer-canvas-container pdf-editor-canvas-container" data-ref="crop-scroll-container">
            <div class="crop-workspace-container">
              <div class="crop-scaler tool-viewport-scaler" data-ref="crop-scaler">
                <div class="crop-preview-wrap tool-viewport-sheet" data-ref="crop-preview-wrap">
                  <canvas class="crop-canvas" data-ref="crop-canvas"></canvas>
                  <div class="crop-overlay" data-ref="crop-overlay"></div>
                  <div class="crop-mask crop-mask--top" data-ref="mask-top"></div>
                  <div class="crop-mask crop-mask--bottom" data-ref="mask-bottom"></div>
                  <div class="crop-mask crop-mask--left" data-ref="mask-left"></div>
                  <div class="crop-mask crop-mask--right" data-ref="mask-right"></div>

                  <div class="crop-box" data-ref="crop-box">
                    <div class="crop-handle crop-handle--nw" data-handle="nw"></div>
                    <div class="crop-handle crop-handle--n" data-handle="n"></div>
                    <div class="crop-handle crop-handle--ne" data-handle="ne"></div>
                    <div class="crop-handle crop-handle--e" data-handle="e"></div>
                    <div class="crop-handle crop-handle--se" data-handle="se"></div>
                    <div class="crop-handle crop-handle--s" data-handle="s"></div>
                    <div class="crop-handle crop-handle--sw" data-handle="sw"></div>
                    <div class="crop-handle crop-handle--w" data-handle="w"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>

    <div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
      <aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="crop-pdf-sidebar">
      <div class="tool-sidebar__header">
        <div class="tool-sidebar__header-left">
          <svg class="component-icon tool-sidebar__header-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
          <h2 class="tool-sidebar__title">Opciones de recorte</h2>
        </div>
        <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close" aria-label="Cerrar">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
        </button>
      </div>

      <div class="tool-sidebar__body">
        <div class="tool-sidebar-notice" data-ref="crop-info-notice">
          <svg class="component-icon tool-sidebar-notice__icon" aria-hidden="true"><use href="/icons.svg#info"></use></svg>
          <div class="tool-sidebar-notice__text">Haz clic y arrastra sobre el documento para crear el área de recorte. Podrás moverla o redimensionarla desde las esquinas.</div>
        </div>

        <div class="tool-sidebar__section">
          <span class="tool-sidebar__section-title">Páginas a recortar</span>
          <div class="component-toggle-pill component-toggle-pill--w-full" data-ref="toggle-crop-mode" data-active="0">
            <div class="component-toggle-pill-glider"></div>
            <button type="button" class="component-button component-button--rounded-pill is-active" data-ref="btn-crop-all" data-val="all">Todas las páginas</button>
            <button type="button" class="component-button component-button--rounded-pill" data-ref="btn-crop-current" data-val="current">Página actual</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
  </div>

  <footer class="tool-footer collaborative-footer is-hidden" data-ref="tool-footer">
    <div class="collaborative-footer__right" data-ref="footer-right">
      <span class="collaborative-footer__page-text" data-ref="txt-footer-page-info">1 de 1</span>
      <div class="collaborative-footer__divider"></div>
      <input class="collaborative-zoom-slider" data-ref="slider-zoom" type="range" min="10" max="300" step="1" value="100" aria-label="Nivel de zoom" />
      <button type="button" class="collaborative-zoom-level-btn" data-ref="btn-zoom-reset" data-tooltip="Restablecer zoom" aria-label="Restablecer zoom">
        <span data-ref="txt-zoom-level">100%</span>
      </button>
    </div>
  </footer>
</div>
