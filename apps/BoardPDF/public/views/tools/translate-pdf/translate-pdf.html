<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="translate-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>
    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" data-i18n-placeholder="common.document_name_placeholder" type="text" placeholder=" " value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-i18n-tooltip="common.options" data-i18n-aria="common.options">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
        <span class="component-button__text" data-i18n="common.options"></span>
      </button>
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-translate-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#translate"></use></svg>
        <span class="component-button__text" data-ref="txt-translate-action" data-i18n="tools.translate_pdf_action"></span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="translate-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="translate-pdf-workspace">
      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="translate-selected-card">
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#translate"></use></svg>
          <span data-i18n="tools.translate_workspace_hint"></span>
        </div>
        <div class="pdf-items-grid" data-ref="pdf-items-grid">
          <div class="pdf-card" data-ref="selected-file-card">
            <div class="pdf-card__actions">
              <button type="button" class="component-button pdf-card__btn-remove" data-ref="btn-remove-file" data-i18n-title="common.delete_file" data-i18n-aria="common.delete_file">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>
            <div class="pdf-card__sheet-wrapper">
              <div class="pdf-card__sheet">
                <canvas class="pdf-card__canvas" data-ref="doc-preview-canvas"></canvas>
              </div>
            </div>
            <span class="pdf-card__filename" data-ref="selected-file-name"></span>
            <span class="pdf-card__meta" data-ref="selected-file-size"></span>
          </div>
        </div>
        <div class="banner banner--danger is-hidden" data-ref="translate-error-banner" role="alert"></div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>
    <div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
      <aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="translate-pdf-sidebar">
        <div class="menu-panel__drag-zone" data-ref="translate-sidebar-drag-zone" aria-hidden="true">
          <div class="menu-panel__drag-handle"></div>
        </div>
        <div class="tool-sidebar__header">
          <div class="component-title-badge" data-ref="translate-sidebar-title-badge">
            <h1 class="component-title-badge__text" data-ref="translate-sidebar-title" data-i18n="tools.translate_pdf_options"></h1>
          </div>
          <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>

        <div class="tool-sidebar__body">
          <div class="tool-sidebar__section">
            <span class="tool-sidebar__section-title" data-i18n="tools.translate_from_label"></span>
            <div class="settings-dropdown-wrapper settings-dropdown-wrapper--full tool-sidebar__dropdown--nomargin" data-ref="wrapper-source-lang">
              <button type="button" class="dropdown-trigger dropdown-trigger--full" data-ref="btn-trigger-source-lang" data-i18n-aria="aria.select_source_lang">
                <div class="dropdown-trigger__left" data-ref="dropdown-trigger-left-source">
                  <svg class="component-icon dropdown-trigger__icon" aria-hidden="true"><use href="/icons.svg#language"></use></svg>
                  <span class="dropdown-trigger__text" data-ref="txt-selected-source-lang" data-i18n="tools.translate_auto_detect"></span>
                </div>
                <svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
              </button>
              <div class="dropdown-backdrop" data-ref="backdrop-source-lang">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="menu-source-lang">
                  <div class="menu-panel__drag-zone" aria-hidden="true">
                    <div class="menu-panel__drag-handle"></div>
                  </div>
                  <div class="menu-panel__search" data-ref="search-wrapper-source-lang">
                    <svg class="component-icon menu-panel__search-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
                    <input class="menu-panel__search-input" data-ref="input-search-source-lang" data-i18n-placeholder="common.search_language_placeholder" type="text" placeholder=" " maxlength="50" autocomplete="off" />
                  </div>
                  <div class="menu-panel__list menu-panel__list--scrollable menu-panel__list--max-h240" data-ref="list-source-lang"></div>
                  <div class="menu-panel__empty is-hidden" data-ref="empty-source-lang" data-i18n="tools.languages_not_found"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="tool-sidebar__section">
            <span class="tool-sidebar__section-title" data-i18n="tools.translate_to_label"></span>
            <div class="settings-dropdown-wrapper settings-dropdown-wrapper--full tool-sidebar__dropdown--nomargin" data-ref="wrapper-target-lang">
              <button type="button" class="dropdown-trigger dropdown-trigger--full" data-ref="btn-trigger-target-lang" data-i18n-aria="aria.select_target_lang">
                <div class="dropdown-trigger__left" data-ref="dropdown-trigger-left-target">
                  <svg class="component-icon dropdown-trigger__icon" aria-hidden="true"><use href="/icons.svg#language"></use></svg>
                  <span class="dropdown-trigger__text" data-ref="txt-selected-target-lang" data-i18n="tools.lang_spanish"></span>
                </div>
                <svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
              </button>
              <div class="dropdown-backdrop" data-ref="backdrop-target-lang">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="menu-target-lang">
                  <div class="menu-panel__drag-zone" aria-hidden="true">
                    <div class="menu-panel__drag-handle"></div>
                  </div>
                  <div class="menu-panel__search" data-ref="search-wrapper-target-lang">
                    <svg class="component-icon menu-panel__search-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
                    <input class="menu-panel__search-input" data-ref="input-search-target-lang" data-i18n-placeholder="common.search_language_placeholder" type="text" placeholder=" " maxlength="50" autocomplete="off" />
                  </div>
                  <div class="menu-panel__list menu-panel__list--scrollable menu-panel__list--max-h240" data-ref="list-target-lang"></div>
                  <div class="menu-panel__empty is-hidden" data-ref="empty-target-lang" data-i18n="tools.languages_not_found"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="tool-sidebar__section">
            <span class="tool-sidebar__section-title" data-i18n="tools.translate_mode_title"></span>
            <div class="component-tabs" data-ref="translate-layout-toggle" data-active="0">
              <button type="button" class="component-tab is-active" data-ref="btn-layout-preserve" data-i18n="tools.translate_layout_preserve_title" data-layout="preserve"></button>
              <button type="button" class="component-tab" data-ref="btn-layout-text" data-i18n="tools.translate_layout_text_title" data-layout="text_only"></button>
            </div>
          </div>

          <div class="translate-layout-card" data-ref="translate-layout-card">
            <div class="translate-layout-card__header">
              <svg class="component-icon translate-layout-card__icon" aria-hidden="true"><use href="/icons.svg#auto_awesome"></use></svg>
              <span class="translate-layout-card__title" data-ref="translate-layout-title" data-i18n="tools.translate_layout_preserve_title"></span>
            </div>
            <p class="translate-layout-card__desc" data-ref="translate-layout-desc" data-i18n="tools.translate_layout_preserve_desc"></p>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
