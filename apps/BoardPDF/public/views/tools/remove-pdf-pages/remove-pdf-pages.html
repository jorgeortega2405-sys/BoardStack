<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="remove-pages-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>
    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" data-i18n-placeholder="common.document_name_placeholder" type="text" placeholder=" " value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-i18n-tooltip="common.options" data-i18n-aria="common.options">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
        <span class="component-button__text" data-i18n="common.options"></span>
      </button>
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-main-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete_sweep"></use></svg>
        <span class="component-button__text" data-ref="txt-main-action" data-i18n="tools.remove_pdf_pages_btn_select"></span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="remove-pages-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="remove-pages-workspace">
      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="pdf-items-card">
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
          <span data-i18n="tools.remove_pdf_pages_info_hint"></span>
        </div>
        <div class="pdf-items-grid remove-pages-grid" data-ref="remove-pages-grid"></div>
        <div class="banner banner--danger is-hidden" data-ref="remove-global-error" role="alert"></div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>
    <div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
      <aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="remove-pages-sidebar">
        <div class="menu-panel__drag-zone" data-ref="remove-sidebar-drag-zone" aria-hidden="true">
          <div class="menu-panel__drag-handle"></div>
        </div>
        <div class="tool-sidebar__header">
          <div class="component-title-badge" data-ref="remove-sidebar-title-badge">
            <h1 class="component-title-badge__text" data-ref="remove-sidebar-title" data-i18n="tools.remove_pdf_pages_options"></h1>
          </div>
          <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>

        <div class="tool-sidebar__body">
          <div class="tool-sidebar__section">
            <span class="tool-sidebar__section-title" data-i18n="tools.remove_pdf_pages_to_remove_title"></span>
            <div class="remove-pages-selector" data-ref="remove-pages-selector"></div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
