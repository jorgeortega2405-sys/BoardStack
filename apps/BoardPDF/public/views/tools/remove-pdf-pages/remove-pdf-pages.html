<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="remove-pages-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>

    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" placeholder="Nombre del documento" value="" autocomplete="off" />
      <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-options">
        <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-tooltip="Opciones" aria-label="Opciones">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
          <span class="component-button__text">Opciones</span>
        </button>
        <div class="dropdown-backdrop" data-ref="dropdown-backdrop-options"></div>
        <div class="menu-panel menu-panel--dropdown tool-options-popover" data-ref="dropdown-menu-options">
          <div class="menu-panel__list">
            <label class="field">
              <input class="field__input" data-ref="input-pages-to-remove" type="text" placeholder=" " value="" autocomplete="off" />
              <span class="field__label" data-i18n="tools.remove_pdf_pages_to_remove_placeholder">Páginas para quitar (ej. 1, 5-8)</span>
            </label>
          </div>
        </div>
      </div>

      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-main-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete_sweep"></use></svg>
        <span class="component-button__text" data-ref="txt-main-action" data-i18n="tools.remove_pdf_pages_btn_select">Eliminar páginas</span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="remove-pages-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="remove-pages-workspace">
      <input class="pdf-dropzone__input" data-ref="input-pdf-file" type="file" accept="application/pdf,.pdf" />

      <div class="tool-workspace__canvas" data-ref="pdf-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="pdf-dropzone">
          <h1 class="tool-hero-dropzone__title" data-i18n="tools.remove_pdf_pages_title">Eliminar páginas</h1>
          <p class="tool-hero-dropzone__desc" data-i18n="tools.remove_pdf_pages_subtitle">Selecciona y elimina las páginas que no necesitas de tu documento PDF.</p>

          <div class="tool-hero-dropzone__actions">
            <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-browse-pdf">
              <span data-i18n="tools.remove_pdf_pages_btn_select">Seleccionar PDF</span>
            </button>
            <div class="tool-hero-dropzone__cloud-btns">
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-drive" data-tooltip="Google Drive" aria-label="Google Drive">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-dropbox" data-tooltip="Dropbox" aria-label="Dropbox">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              </button>
            </div>
          </div>

          <p class="tool-hero-dropzone__hint">o arrastra y suelta el PDF aquí</p>
        </div>
      </div>

      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="pdf-items-card">

        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
          <span data-i18n="tools.remove_pdf_pages_info_hint">Haz click en las páginas que quieres eliminar de tu documento. Presiona 'Shift' para establecer rangos.</span>
        </div>

        <div class="pdf-items-grid remove-pages-grid" data-ref="remove-pages-grid"></div>
      </div>
    </main>
  </div>
</div>
