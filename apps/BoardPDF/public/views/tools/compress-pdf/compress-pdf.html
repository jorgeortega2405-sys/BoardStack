<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="compress-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>
    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" data-i18n-placeholder="common.document_name_placeholder" type="text" placeholder=" " value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-top-btn" data-ref="btn-toggle-options" data-i18n-tooltip="tools.compress_pdf_options" data-i18n-aria="tools.compress_pdf_options">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
        <span class="component-button__text" data-i18n="common.options"></span>
      </button>
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-compress-action" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#compress"></use></svg>
        <span class="component-button__text" data-ref="txt-compress-action" data-i18n="tools.compress_pdf_action"></span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="compress-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="compress-pdf-workspace">
      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="compress-selected-card">
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#compress"></use></svg>
          <span data-i18n="tools.compress_pdf_hint"></span>
        </div>
        <div class="pdf-items-grid" data-ref="pdf-items-grid">
          <div class="pdf-card">
            <div class="pdf-card__actions">
              <button type="button" class="component-button pdf-card__btn-remove" data-ref="btn-remove-file" data-i18n-title="common.delete_file" data-i18n-aria="common.delete_file">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>
            <div class="pdf-card__sheet-wrapper">
              <div class="pdf-card__sheet">
                <canvas class="pdf-card__canvas" data-ref="doc-preview-canvas"></canvas>
              </div>
            </div>
            <span class="pdf-card__filename" data-ref="selected-file-name"></span>
            <span class="pdf-card__meta" data-ref="selected-file-size"></span>
          </div>
        </div>
        <div class="banner banner--danger is-hidden" data-ref="compress-global-error" role="alert"></div>
      </div>
    </main>

    <div class="tool-sidebar-backdrop is-hidden" data-ref="tool-sidebar-backdrop"></div>
    <div class="tool-sidebar-container is-hidden" data-ref="tool-sidebar-container">
      <aside class="tool-layout__sidebar tool-layout__sidebar--absolute is-hidden" data-ref="compress-pdf-sidebar">
        <div class="menu-panel__drag-zone" data-ref="compress-sidebar-drag-zone" aria-hidden="true">
          <div class="menu-panel__drag-handle"></div>
        </div>
        <div class="tool-sidebar__header">
          <div class="component-title-badge" data-ref="compress-sidebar-title-badge">
            <h1 class="component-title-badge__text" data-ref="compress-sidebar-title" data-i18n="tools.compress_pdf_options"></h1>
          </div>
          <button type="button" class="tool-sidebar__close-btn" data-ref="btn-sidebar-close" data-i18n-aria="common.close">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>

        <div class="tool-sidebar__body">
          <div class="tool-sidebar__section">
            <span class="tool-sidebar__section-title" data-i18n="tools.compress_level_title"></span>
            <div class="component-tabs" data-ref="compress-level-toggle" data-level="recommended" data-active="1">
              <button type="button" class="component-tab" data-ref="btn-compress-extreme" data-level="extreme" data-i18n="tools.compress_level_extreme"></button>
              <button type="button" class="component-tab is-active" data-ref="btn-compress-recommended" data-level="recommended" data-i18n="tools.compress_level_recommended"></button>
              <button type="button" class="component-tab" data-ref="btn-compress-low" data-level="low" data-i18n="tools.compress_level_low"></button>
            </div>
          </div>
          <div class="compress-quality-card" data-ref="compress-quality-card">
            <div class="compress-quality-card__header">
              <svg class="component-icon compress-quality-card__icon" aria-hidden="true"><use href="/icons.svg#compress"></use></svg>
              <span class="compress-quality-card__title" data-ref="compress-quality-title" data-i18n="tools.compress_recommended_title"></span>
            </div>
            <p class="compress-quality-card__desc" data-ref="compress-quality-desc" data-i18n="ui.buena_calidad_visual_reduccion_sustancia"></p>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
