<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="unlock-pdf-wrapper">
  <header class="component-top tool-top-bar is-hidden" data-ref="component-top">
    <div class="tool-top-bar__left" data-ref="tool-top-left"></div>

    <div class="tool-top-bar__right" data-ref="tool-top-right">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" placeholder="Nombre del documento" value="" autocomplete="off" />
      <button type="button" class="component-button component-button--h40 tool-action-btn" data-ref="btn-execute-unlock" disabled>
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#lock_open"></use></svg>
        <span class="component-button__text">Desbloquear PDF</span>
      </button>
    </div>
  </header>

  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="unlock-pdf-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="unlock-pdf-workspace">
      <input class="pdf-dropzone__input" data-ref="input-pdf-file" type="file" accept=".pdf,application/pdf" />

      <div class="tool-workspace__canvas" data-ref="unlock-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="unlock-dropzone">
          <h1 class="tool-hero-dropzone__title">Desbloquear PDF</h1>
          <p class="tool-hero-dropzone__desc">Elimina la contraseña de seguridad de tu documento PDF para poder abrirlo, editarlo e imprimirlo libremente.</p>

          <div class="tool-hero-dropzone__actions">
            <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-browse-pdf">
              <span>Seleccionar PDF</span>
            </button>
            <div class="tool-hero-dropzone__cloud-btns">
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-drive" data-tooltip="Google Drive" aria-label="Google Drive">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-hero-dropbox" data-tooltip="Dropbox" aria-label="Dropbox">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              </button>
            </div>
          </div>

          <p class="tool-hero-dropzone__hint">o arrastra y suelta el PDF aquí</p>
        </div>
      </div>

      <div class="pdf-items-view pdf-items-view--full-width is-hidden" data-ref="unlock-workspace-card">

        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#lock_open"></use></svg>
          <span>Haz clic en Desbloquear PDF en la barra superior para quitar las restricciones a tu documento.</span>
        </div>

        <div class="pdf-items-grid" data-ref="pdf-items-grid">
          <div class="pdf-card">
            <div class="pdf-card__actions">
              <button type="button" class="component-button pdf-card__btn-remove" data-ref="btn-remove-file" title="Eliminar archivo" aria-label="Eliminar archivo">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>
            <div class="pdf-card__sheet-wrapper">
              <div class="pdf-card__sheet">
                <canvas class="pdf-card__canvas" data-ref="unlock-doc-canvas"></canvas>
                <div class="security-doc-card__locked-placeholder is-hidden" data-ref="unlock-locked-placeholder">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#lock"></use></svg>
                  <span class="security-doc-card__locked-text">Archivo protegido</span>
                </div>
              </div>
            </div>
            <span class="pdf-card__filename" data-ref="txt-file-name">documento.pdf</span>
            <span class="pdf-card__meta" data-ref="txt-file-size">0 KB</span>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
