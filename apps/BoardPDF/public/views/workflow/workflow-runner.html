<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="workflow-runner-wrapper">
  <div class="component-bottom tool-bottom tool-bottom--grid tool-layout tool-layout--grid" data-ref="workflow-layout">
    <main class="tool-layout__workspace tool-layout__workspace--grid" data-ref="workflow-workspace">
      <input class="pdf-dropzone__input is-hidden" data-ref="input-pdf-file" type="file" accept="application/pdf,.pdf" />
      <div class="tool-workspace__canvas" data-ref="workflow-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="workflow-dropzone">
          <div class="tool-hero-dropzone__icon-circle">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#account_tree"></use></svg>
          </div>
          <h1 class="tool-hero-dropzone__title" data-i18n="workflows.runner_drop_title"></h1>
          <p class="tool-hero-dropzone__desc" data-i18n="workflows.runner_drop_desc"></p>
          <div class="tool-hero-dropzone__actions">
            <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-browse-file">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#upload_file"></use></svg>
              <span data-i18n="workflows.runner_select_pdf"></span>
            </button>
          </div>
          <p class="tool-hero-dropzone__hint" data-i18n="workflows.runner_drop_hint"></p>
        </div>
      </div>

      <div class="pdf-items-view tool-sidebar__flex-1 is-hidden" data-ref="workflow-organize-card">
        <div class="tool-workspace__toolbar">
          <div class="tool-workspace__toolbar-left">
            <h2 class="tool-workspace__toolbar-title">
              <span data-i18n="tools.document_label"></span>
              (<span data-ref="workflow-organize-count"></span>)
            </h2>
          </div>
          <div class="tool-workspace__toolbar-actions">
            <button type="button" class="component-button component-button--secondary component-button--h36" data-ref="btn-organize-rotate-all">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#redo"></use></svg>
              <span data-i18n="tools.rotate_all_pages"></span>
            </button>
            <button type="button" class="component-button component-button--secondary component-button--h36" data-ref="btn-organize-reset">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#refresh"></use></svg>
              <span data-i18n="tools.reset_order"></span>
            </button>
          </div>
        </div>
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#info"></use></svg>
          <span data-i18n="tools.organize_pdf_info_hint"></span>
        </div>
        <div class="pdf-items-grid" data-ref="workflow-organize-grid"></div>
      </div>

      <div class="pdf-items-view tool-sidebar__flex-1 is-hidden" data-ref="workflow-split-card">
        <div class="tool-workspace__toolbar">
          <div class="tool-workspace__toolbar-left">
            <h2 class="tool-workspace__toolbar-title">
              <span data-i18n="tools.split_pages_label"></span>
              (<span data-ref="workflow-split-count"></span>)
            </h2>
          </div>
          <div class="tool-workspace__toolbar-actions">
            <button type="button" class="component-button component-button--secondary component-button--h36" data-ref="btn-split-select-all">
              <span data-i18n="tools.select_all"></span>
            </button>
            <button type="button" class="component-button component-button--secondary component-button--h36" data-ref="btn-split-deselect-all">
              <span data-i18n="tools.deselect_all"></span>
            </button>
          </div>
        </div>
        <div class="pdf-reorder-hint">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#info"></use></svg>
          <span data-i18n="workflows.runner_split_hint"></span>
        </div>
        <div class="pdf-items-grid" data-ref="workflow-split-grid"></div>
      </div>

      <div class="tool-workspace__canvas is-hidden" data-ref="workflow-overview-card">
        <div class="pdf-selected-file-panel">
          <div class="pdf-selected-file__icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#picture_as_pdf"></use></svg>
          </div>
          <div class="pdf-selected-file__info">
            <span class="pdf-selected-file__name" data-ref="overview-file-name"></span>
            <span class="pdf-selected-file__size" data-ref="overview-file-size"></span>
          </div>
        </div>
      </div>
    </main>

    <aside class="tool-layout__sidebar" data-ref="workflow-sidebar">
      <div class="tool-sidebar__header">
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h32" data-ref="btn-back-home" data-i18n-aria="common.back">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_back"></use></svg>
        </button>
        <div class="component-title-badge" data-ref="workflow-sidebar-title-badge">
          <h1 class="component-title-badge__text" data-ref="workflow-sidebar-title" data-i18n="workflows.loading_title"></h1>
        </div>
      </div>
      <div class="tool-sidebar__body">
        <p class="tool-sidebar__subtitle" data-ref="workflow-sidebar-subtitle" data-i18n="workflows.runner_subtitle"></p>
        <div class="tool-sidebar__section">
          <span class="tool-sidebar__section-title" data-i18n="workflows.runner_steps_title"></span>
          <div class="workflow-stepper-list" data-ref="workflow-stepper-list"></div>
        </div>
        <div class="tool-sidebar__section is-hidden" data-ref="section-active-options">
          <span class="tool-sidebar__section-title" data-ref="active-step-title" data-i18n="workflows.runner_step_config_title"></span>
          <div class="active-step-body tool-sidebar__section" data-ref="active-step-body"></div>
        </div>
      </div>
      <div class="tool-sidebar__footer">
        <button type="button" class="component-button component-button--black component-button--h50 component-button--w-full tool-sidebar__action-btn" data-ref="btn-main-action" disabled>
          <span data-ref="txt-main-action" data-i18n="workflows.runner_select_pdf"></span>
          <svg class="component-icon" data-ref="icon-main-action" aria-hidden="true"><use href="/icons.svg#arrow_forward"></use></svg>
        </button>
        <button type="button" class="component-button component-button--secondary component-button--h44 component-button--w-full is-hidden" data-ref="btn-sidebar-reset">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#refresh"></use></svg>
          <span data-i18n="workflows.runner_restart"></span>
        </button>
        <div class="banner banner--danger tool-sidebar__error-banner is-hidden" data-ref="workflow-error-banner" role="alert"></div>
      </div>
    </aside>
  </div>
</div>
