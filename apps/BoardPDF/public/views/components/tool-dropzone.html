<div class="tool-workspace__canvas" data-ref="tool-dropzone-card">
  <input class="pdf-dropzone__input" data-ref="tool-dropzone-input" type="file" />
  <div class="tool-hero-dropzone" data-ref="tool-dropzone">
    <h1 class="tool-hero-dropzone__title" data-ref="tool-dropzone-title" data-i18n="tools.default_title"></h1>
    <p class="tool-hero-dropzone__desc" data-ref="tool-dropzone-desc" data-i18n="tools.default_desc"></p>
    <div class="tool-hero-dropzone__actions" data-ref="tool-dropzone-actions">
      <button type="button" class="component-button component-button--black component-button--h55 tool-hero-dropzone__btn-select" data-ref="btn-tool-browse">
        <span data-ref="tool-dropzone-btn-text" data-i18n="tools.select_file_btn"></span>
      </button>
      <div class="tool-hero-dropzone__cloud-btns" data-ref="tool-dropzone-cloud-btns">
        <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-tool-drive" data-i18n-tooltip="common.google_drive" data-i18n-aria="common.google_drive">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
        </button>
        <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-tool-dropbox" data-i18n-tooltip="common.dropbox" data-i18n-aria="common.dropbox">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
        </button>
      </div>
    </div>
    <p class="tool-hero-dropzone__hint" data-ref="tool-dropzone-hint" data-i18n="common.drop_file_hint"></p>
  </div>
</div>
