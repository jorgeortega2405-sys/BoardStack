<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="org-invitations-wrapper">
  <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
    <div class="home-floating-top home-floating-top--gradient" data-ref="invitations-header">
      <div class="home-floating-top__left" data-ref="invitations-header-left">
        <h1 class="section-floating-title" data-ref="invitations-title" data-i18n="org.invitations.title">Invitaciones Pendientes</h1>
      </div>

      <div class="home-floating-top__right" data-ref="invitations-header-right">
        <div class="home-floating-actions" data-ref="invitations-header-actions">
          <div class="component-search" data-ref="search-invitations" style="max-width: 240px; height: 34px;">
            <div class="component-search__icon" data-ref="search-invitations-icon">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            </div>
            <div class="component-search__input-box" data-ref="search-invitations-input-box">
              <input class="component-search__input" data-ref="input-search-invitations" data-i18n-placeholder="org.invitations.search_placeholder" type="text" placeholder="Buscar por correo..." />
            </div>
          </div>

          <button type="button" class="component-button component-button--h34 component-button--danger is-hidden" data-ref="btn-action-revoke-invitation">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
            <span>Revocar</span>
          </button>

          <button type="button" class="component-button component-button--h34" data-ref="btn-go-members">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#groups"></use></svg>
            <span data-i18n="org.invitations.btn_members">Miembros</span>
          </button>
          <button type="button" class="component-button component-button--h34 component-button--black" data-ref="btn-open-invite">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
            <span data-i18n="org.members.btn_invite">Invitar miembro</span>
          </button>
        </div>
      </div>
    </div>

    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="invitations-scrollable" style="box-sizing: border-box; display: flex; flex-direction: column; padding: 0; width: 100%;">
      <div class="component-table-wrapper" data-ref="invitations-table-wrapper" style="border-radius: 0; border-left: none; border-right: none; border-top: none; width: 100%;">
        <table class="component-table" data-ref="invitations-table">
          <thead class="component-table__head" data-ref="invitations-thead">
            <tr>
              <th data-ref="th-inv-email" style="padding-left: 20px;">Correo invitado</th>
              <th data-ref="th-inv-role">Rol propuesto</th>
              <th data-ref="th-inv-status">Estado</th>
              <th data-ref="th-inv-expires" style="padding-right: 20px;">Expira</th>
            </tr>
          </thead>
          <tbody class="component-table__body" data-ref="invitations-container">
            <tr data-ref="invitations-loading">
              <td class="component-table__cell" colspan="4" style="text-align: center; padding: 32px 16px; color: var(--text-secondary);" data-i18n="org.invitations.loading">
                Cargando invitaciones pendientes...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="banner banner--danger is-hidden" data-ref="invitations-error" style="margin: 12px 20px;"></div>
      <div class="banner banner--success is-hidden" data-ref="invitations-success" style="margin: 12px 20px;"></div>
    </div>
  </div>
</div>
