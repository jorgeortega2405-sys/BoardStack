<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="org-dashboard-wrapper">
  <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
    <div class="home-floating-top home-floating-top--gradient" data-ref="org-header">
      <div class="home-floating-top__left" data-ref="org-header-left">
        <h1 class="section-floating-title" data-ref="org-title" data-i18n="org.dashboard.title">Panel de Organización</h1>
      </div>
      <div class="home-floating-top__right" data-ref="org-header-right">
        <div class="home-floating-actions" data-ref="org-header-actions">
          <button type="button" class="component-button component-button--h34" data-ref="btn-go-members">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#groups"></use></svg>
            <span data-i18n="org.dashboard.btn_manage_members">Miembros</span>
          </button>
          <button type="button" class="component-button component-button--h34 component-button--black" data-ref="btn-go-sso">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#vpn_key"></use></svg>
            <span data-i18n="org.dashboard.btn_configure_sso">Configurar SSO</span>
          </button>
        </div>
      </div>
    </div>

    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="org-scrollable" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 24px; width: 100%;">
      <div class="org-hero-card" data-ref="item-org-identity">
        <div class="org-hero-card__avatar" data-ref="org-icon-box">
          <svg class="component-icon" aria-hidden="true" style="font-size: 28px; height: 28px; width: 28px;"><use href="/icons.svg#domain"></use></svg>
        </div>
        <div class="org-hero-card__info" data-ref="org-text">
          <div style="align-items: center; display: flex; flex-wrap: wrap; gap: 10px;">
            <h2 class="org-hero-card__title" data-ref="display-org-name" data-i18n="org.dashboard.loading">Cargando...</h2>
            <span class="component-badge component-badge--sm component-badge--success" data-ref="badge-org-tier" data-i18n="org.dashboard.tier_enterprise">Enterprise</span>
          </div>
          <p class="org-hero-card__desc" data-ref="display-org-domain">-</p>
        </div>
      </div>

      <div class="org-stats-grid" data-ref="org-stats-grid">
        <div class="org-stat-card" data-ref="stat-members">
          <div class="org-stat-card__icon" data-ref="stat-members-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#groups"></use></svg>
          </div>
          <div class="org-stat-card__content" data-ref="stat-members-content">
            <span class="org-stat-card__label" data-ref="stat-members-label" data-i18n="org.dashboard.stat_members">Integrantes activos</span>
            <h3 class="org-stat-card__value" data-ref="stat-members-val">-</h3>
          </div>
        </div>

        <div class="org-stat-card" data-ref="stat-invitations">
          <div class="org-stat-card__icon" data-ref="stat-invitations-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#mail"></use></svg>
          </div>
          <div class="org-stat-card__content" data-ref="stat-invitations-content">
            <span class="org-stat-card__label" data-ref="stat-invitations-label" data-i18n="org.dashboard.stat_invitations">Invitaciones pendientes</span>
            <h3 class="org-stat-card__value" data-ref="stat-invitations-val">-</h3>
          </div>
        </div>

        <div class="org-stat-card" data-ref="stat-sso">
          <div class="org-stat-card__icon" data-ref="stat-sso-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#vpn_key"></use></svg>
          </div>
          <div class="org-stat-card__content" data-ref="stat-sso-content">
            <span class="org-stat-card__label" data-ref="stat-sso-label" data-i18n="org.dashboard.stat_sso">Estado SSO / SAML</span>
            <h3 class="org-stat-card__value" data-ref="stat-sso-val">-</h3>
          </div>
        </div>
      </div>

      <div class="banner banner--danger is-hidden" data-ref="org-dashboard-error"></div>
    </div>
  </div>
</div>
