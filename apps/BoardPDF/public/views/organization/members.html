<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="org-members-wrapper">
  <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
    <div class="home-floating-top home-floating-top--gradient" data-ref="members-header">
      <div class="home-floating-top__left" data-ref="members-header-left">
        <h1 class="section-floating-title" data-ref="members-title" data-i18n="org.members.title">Gestión de Miembros</h1>
      </div>

      <div class="home-floating-top__right" data-ref="members-header-right">
        <div class="home-floating-actions" data-ref="members-header-actions">
          <div class="component-search" data-ref="search-members" style="max-width: 240px; height: 34px;">
            <div class="component-search__icon" data-ref="search-members-icon">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            </div>
            <div class="component-search__input-box" data-ref="search-members-input-box">
              <input class="component-search__input" data-ref="input-search-members" data-i18n-placeholder="org.members.search_placeholder" type="text" placeholder="Buscar por nombre o correo..." />
            </div>
          </div>

          <button type="button" class="component-button component-button--h34 is-hidden" data-ref="btn-action-manage-role">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
            <span>Gestionar rol</span>
          </button>
          <button type="button" class="component-button component-button--h34 component-button--danger is-hidden" data-ref="btn-action-delete-member">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
            <span>Eliminar</span>
          </button>

          <button type="button" class="component-button component-button--h34" data-ref="btn-go-invitations">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#mail"></use></svg>
            <span data-i18n="org.members.btn_invitations">Invitaciones</span>
          </button>
          <button type="button" class="component-button component-button--h34 component-button--black" data-ref="btn-open-invite">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
            <span data-i18n="org.members.btn_invite">Invitar miembro</span>
          </button>
        </div>
      </div>
    </div>

    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="members-scrollable" style="box-sizing: border-box; display: flex; flex-direction: column; padding: 0; width: 100%;">
      <div class="component-table-wrapper" data-ref="members-table-wrapper" style="border-radius: 0; border-left: none; border-right: none; border-top: none; width: 100%;">
        <table class="component-table" data-ref="members-table">
          <thead class="component-table__head" data-ref="members-thead">
            <tr>
              <th data-ref="th-member" style="padding-left: 20px;">Miembro</th>
              <th data-ref="th-email">Correo electrónico</th>
              <th data-ref="th-role">Rol</th>
              <th data-ref="th-date" style="padding-right: 20px;">Fecha de ingreso</th>
            </tr>
          </thead>
          <tbody class="component-table__body" data-ref="members-container">
            <tr data-ref="members-loading">
              <td class="component-table__cell" colspan="4" style="text-align: center; padding: 32px 16px; color: var(--text-secondary);" data-i18n="org.members.loading">
                Cargando miembros de la organización...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="banner banner--danger is-hidden" data-ref="members-error" style="margin: 12px 20px;"></div>
      <div class="banner banner--success is-hidden" data-ref="members-success" style="margin: 12px 20px;"></div>

      <div class="is-hidden" data-ref="invite-modal-template" style="display: none;">
        <button type="button" class="component-button" data-ref="btn-submit-invite">Invitar</button>
        <div class="banner banner--danger is-hidden" data-ref="invite-error"></div>
      </div>
    </div>
  </div>
</div>
