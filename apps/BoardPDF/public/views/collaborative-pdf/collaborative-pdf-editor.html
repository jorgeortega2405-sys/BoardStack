<div class="component-wrapper component-wrapper--full view-wrapper collaborative-editor-wrapper" data-ref="collaborative-editor-wrapper">
  <header class="collaborative-top-bar" data-ref="collaborative-top-bar">
    <div class="collaborative-top-bar__left">
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" value="Documento sin título" placeholder="Nombre del documento" />
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36" data-ref="btn-cloud-status" data-tooltip="Guardado en el servidor" aria-label="Guardar cambios">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#cloud"></use></svg>
      </button>
    </div>

    <div class="collaborative-top-bar__right">
      <button type="button" class="component-button component-button--black component-button--h36" data-ref="btn-share-link">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#share"></use></svg>
        <span class="component-button__text">Compartir</span>
      </button>
    </div>
  </header>

  <div class="collaborative-main-body" data-ref="collaborative-main-body">
    <aside class="collaborative-side-panel is-hidden" data-ref="collaborative-side-panel">
      <div class="collaborative-side-panel__header" data-ref="side-panel-header">
        <span class="collaborative-side-panel__title" data-ref="side-panel-title">Elementos</span>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h32" data-ref="btn-close-side-panel" aria-label="Cerrar panel">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
        </button>
      </div>

      <div class="collaborative-side-panel__body" data-ref="side-panel-body">
        <div class="collaborative-panel-section" data-ref="panel-section-elements">
          <div class="collaborative-panel-grid collaborative-panel-grid--3" data-ref="grid-elements">
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-elem-tables">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#table_chart"></use></svg>
              <span class="collaborative-item-card__text">Tablas</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-elem-photos">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#photo_library"></use></svg>
              <span class="collaborative-item-card__text">Fotos</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-elem-charts">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#view_column"></use></svg>
              <span class="collaborative-item-card__text">Gráficas</span>
            </button>
          </div>
        </div>

        <div class="collaborative-panel-section is-hidden" data-ref="panel-section-text">
          <button type="button" class="component-button component-button--black component-button--h48 component-button--w-full" data-ref="btn-add-text-box">
            <svg class="component-icon component-button__icon-left" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
            <span class="component-button__text">Agregar caja de texto</span>
          </button>

          <div class="collaborative-text-presets" data-ref="text-presets-container">
            <button type="button" class="collaborative-text-preset collaborative-text-preset--title" data-ref="btn-preset-title">
              <span class="collaborative-preset-title">Agregar un título</span>
            </button>
            <button type="button" class="collaborative-text-preset collaborative-text-preset--subtitle" data-ref="btn-preset-subtitle">
              <span class="collaborative-preset-subtitle">Agregar un subtítulo</span>
            </button>
            <button type="button" class="collaborative-text-preset collaborative-text-preset--body" data-ref="btn-preset-body">
              <span class="collaborative-preset-body">Agregar algo de texto</span>
            </button>
          </div>
        </div>

        <div class="collaborative-panel-section is-hidden" data-ref="panel-section-uploads">
          <div class="collaborative-empty-state" data-ref="empty-uploads">
            <svg class="component-icon collaborative-empty-state__icon" aria-hidden="true"><use href="/icons.svg#upload_file"></use></svg>
            <span class="collaborative-empty-state__title">Sin archivos subidos</span>
            <span class="collaborative-empty-state__subtitle">Aquí aparecerán tus imágenes y recursos</span>
          </div>
        </div>

        <div class="collaborative-panel-section is-hidden" data-ref="panel-section-tools">
          <div class="collaborative-panel-grid collaborative-panel-grid--2" data-ref="grid-tools">
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-tool-select">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
              <span class="collaborative-item-card__text">Seleccionar</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-tool-draw">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#brush"></use></svg>
              <span class="collaborative-item-card__text">Dibujar</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-tool-shapes">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#layers"></use></svg>
              <span class="collaborative-item-card__text">Formas</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-tool-lines">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#straighten"></use></svg>
              <span class="collaborative-item-card__text">Líneas</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-tool-stickynotes">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#description"></use></svg>
              <span class="collaborative-item-card__text">Notas adhesivas</span>
            </button>
            <button type="button" class="component-button component-button--ghost component-button--card collaborative-item-card" data-ref="btn-tool-text">
              <svg class="component-icon collaborative-item-card__icon" aria-hidden="true"><use href="/icons.svg#text_fields"></use></svg>
              <span class="collaborative-item-card__text">Texto</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main class="collaborative-workspace" data-ref="collaborative-workspace">
      <div class="collaborative-pages-container" data-ref="pages-container"></div>
    </main>
  </div>
</div>
