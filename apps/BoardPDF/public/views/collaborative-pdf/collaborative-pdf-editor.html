<div class="component-wrapper component-wrapper--full view-wrapper collaborative-editor-wrapper" data-ref="collaborative-editor-wrapper">
  <header class="component-top collaborative-top-bar" data-ref="collaborative-top-bar">
    <div class="collaborative-top-bar__left"></div>

    <div class="collaborative-top-bar__right">
      <div class="collab-presence-container" data-ref="collab-presence-container"></div>
      <input class="collaborative-title-input" data-ref="input-doc-title" type="text" value="Documento sin título" placeholder="Nombre del documento" />
      <button type="button" class="component-button component-button--icon-only component-button--h40 collaborative-cloud-btn" data-ref="btn-cloud-status" data-tooltip="Guardado en el servidor" aria-label="Guardar cambios">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#cloud"></use></svg>
      </button>
      <button type="button" class="component-button component-button--h40 collaborative-share-btn" data-ref="btn-share-link">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#share"></use></svg>
        <span class="component-button__text">Compartir</span>
      </button>
    </div>
  </header>

  <div class="collaborative-main-body" data-ref="collaborative-main-body">
    <div class="collaborative-tools-toolbar is-hidden" data-ref="collaborative-tools-toolbar">
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h40 collaborative-toolbar-btn is-active" data-ref="btn-tool-select" data-tool="select" data-tooltip="Seleccionar" aria-label="Seleccionar">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
      </button>
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h40 collaborative-toolbar-btn" data-ref="btn-tool-draw" data-tool="draw" data-tooltip="Dibujar" aria-label="Dibujar">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#brush"></use></svg>
      </button>
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h40 collaborative-toolbar-btn" data-ref="btn-tool-shapes" data-tool="shapes" data-tooltip="Formas" aria-label="Formas">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#layers"></use></svg>
      </button>
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h40 collaborative-toolbar-btn" data-ref="btn-tool-lines" data-tool="lines" data-tooltip="Líneas" aria-label="Líneas">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#straighten"></use></svg>
      </button>
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h40 collaborative-toolbar-btn" data-ref="btn-tool-stickynotes" data-tool="stickynotes" data-tooltip="Notas adhesivas" aria-label="Notas adhesivas">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#sticky_note_2"></use></svg>
      </button>
      <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h40 collaborative-toolbar-btn" data-ref="btn-tool-text" data-tool="text" data-tooltip="Texto" aria-label="Texto">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#text_fields"></use></svg>
      </button>

      <div class="collaborative-subtoolbar-flyout is-hidden" data-ref="collaborative-subtoolbar-flyout">
        <div class="collaborative-subtoolbar is-hidden" data-ref="subtoolbar-draw">
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn is-active" data-ref="btn-draw-pen" data-draw-mode="pen" data-tooltip="Pluma" aria-label="Pluma">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-draw-marker" data-draw-mode="marker" data-tooltip="Plumón" aria-label="Plumón">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#brush"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-draw-highlighter" data-draw-mode="highlighter" data-tooltip="Resaltador" aria-label="Resaltador">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#ink_highlighter"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-draw-eraser" data-draw-mode="eraser" data-tooltip="Borrador" aria-label="Borrador">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#ink_eraser"></use></svg>
          </button>
          <div class="collaborative-subtoolbar__divider"></div>
          <button type="button" class="collaborative-color-picker-btn" data-ref="btn-draw-color" data-tooltip="Color de trazo" aria-label="Color de trazo">
            <div class="collaborative-color-picker-preview" data-ref="preview-draw-color" style="background-color: #000000;"></div>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-draw-thickness" data-tooltip="Grosor de trazo" aria-label="Grosor de trazo">
            <span class="collaborative-thickness-dot" data-ref="dot-thickness" style="width: 4px; height: 4px;"></span>
          </button>
        </div>

        <div class="collaborative-subtoolbar is-hidden" data-ref="subtoolbar-shapes">
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-shape-rect" data-shape="rect" data-tooltip="Cuadrado" aria-label="Cuadrado">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#crop_square"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-shape-circle" data-shape="circle" data-tooltip="Círculo" aria-label="Círculo">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#radio_button_unchecked"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-shape-triangle" data-shape="triangle" data-tooltip="Triángulo" aria-label="Triángulo">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#change_history"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-shape-diamond" data-shape="diamond" data-tooltip="Rombo" aria-label="Rombo">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#diamond"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-shape-arrow" data-shape="arrow" data-tooltip="Flecha" aria-label="Flecha">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_forward"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-shape-star" data-shape="star" data-tooltip="Estrella" aria-label="Estrella">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#star"></use></svg>
          </button>
        </div>

        <div class="collaborative-subtoolbar is-hidden" data-ref="subtoolbar-lines">
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-line-straight" data-line-type="straight" data-tooltip="Línea recta" aria-label="Línea recta">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#horizontal_rule"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-line-flexible" data-line-type="flexible" data-tooltip="Línea flexible / curva" aria-label="Línea flexible">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#show_chart"></use></svg>
          </button>
          <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-subtoolbar-btn" data-ref="btn-line-multiconnect" data-line-type="multiconnect" data-tooltip="Línea de múltiple conexión" aria-label="Línea múltiple">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#call_split"></use></svg>
          </button>
        </div>

        <div class="collaborative-subtoolbar is-hidden" data-ref="subtoolbar-stickynotes">
          <button type="button" class="collaborative-sticky-swatch" data-ref="btn-sticky-yellow" data-color="#fef08a" data-tooltip="Nota amarilla" aria-label="Nota amarilla" style="background-color: #fef08a; border-color: #facc15;"></button>
          <button type="button" class="collaborative-sticky-swatch" data-ref="btn-sticky-orange" data-color="#fed7aa" data-tooltip="Nota naranja" aria-label="Nota naranja" style="background-color: #fed7aa; border-color: #fb923c;"></button>
          <button type="button" class="collaborative-sticky-swatch" data-ref="btn-sticky-green" data-color="#bbf7d0" data-tooltip="Nota verde" aria-label="Nota verde" style="background-color: #bbf7d0; border-color: #4ade80;"></button>
          <button type="button" class="collaborative-sticky-swatch" data-ref="btn-sticky-blue" data-color="#bfdbfe" data-tooltip="Nota azul" aria-label="Nota azul" style="background-color: #bfdbfe; border-color: #60a5fa;"></button>
          <button type="button" class="collaborative-sticky-swatch" data-ref="btn-sticky-pink" data-color="#fbcfe8" data-tooltip="Nota rosa" aria-label="Nota rosa" style="background-color: #fbcfe8; border-color: #f472b6;"></button>
          <button type="button" class="collaborative-sticky-swatch" data-ref="btn-sticky-purple" data-color="#e9d5ff" data-tooltip="Nota morada" aria-label="Nota morada" style="background-color: #e9d5ff; border-color: #c084fc;"></button>
        </div>
      </div>
    </div>

    <div class="collaborative-context-toolbar is-hidden" data-ref="collaborative-context-toolbar">
      <div class="collaborative-context-group is-hidden" data-ref="context-group-text">
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-font-decrease" data-tooltip="Reducir tamaño" aria-label="Reducir tamaño">
          <span class="collaborative-font-step-icon">-</span>
        </button>
        <span class="collaborative-context-value" data-ref="txt-font-size">14</span>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-font-increase" data-tooltip="Aumentar tamaño" aria-label="Aumentar tamaño">
          <span class="collaborative-font-step-icon">+</span>
        </button>
        <div class="collaborative-subtoolbar__divider"></div>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-toggle-bold" data-tooltip="Negrita" aria-label="Negrita">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#format_bold"></use></svg>
        </button>
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-text-color" data-tooltip="Color de texto" aria-label="Color de texto">
          <div class="collaborative-color-picker-preview" data-ref="preview-text-color" style="background-color: #000000;"></div>
        </button>
        <button type="button" class="collaborative-color-picker-btn is-hidden" data-ref="btn-sticky-bg" data-tooltip="Color de fondo de nota" aria-label="Color de fondo de nota">
          <div class="collaborative-color-picker-preview" data-ref="preview-sticky-bg" style="background-color: #fef08a;"></div>
        </button>
      </div>

      <div class="collaborative-context-group is-hidden" data-ref="context-group-shape">
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-shape-fill" data-tooltip="Color de relleno" aria-label="Color de relleno">
          <div class="collaborative-color-picker-preview" data-ref="preview-shape-fill" style="background-color: #000000;"></div>
        </button>
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-shape-stroke" data-tooltip="Color de borde" aria-label="Color de borde">
          <div class="collaborative-color-picker-preview" data-ref="preview-shape-stroke" style="background-color: #000000;"></div>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-shape-strokewidth" data-tooltip="Grosor de borde" aria-label="Grosor de borde">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#straighten"></use></svg>
        </button>
      </div>

      <div class="collaborative-context-group is-hidden" data-ref="context-group-table">
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-table-header-color" data-tooltip="Color de encabezado" aria-label="Color de encabezado">
          <div class="collaborative-color-picker-preview" data-ref="preview-table-header-color" style="background-color: #4b5563;"></div>
        </button>
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-table-border-color" data-tooltip="Color de borde" aria-label="Color de borde">
          <div class="collaborative-color-picker-preview" data-ref="preview-table-border-color" style="background-color: #4b5563;"></div>
        </button>
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-table-bg-color" data-tooltip="Color de celdas" aria-label="Color de celdas">
          <div class="collaborative-color-picker-preview" data-ref="preview-table-bg-color" style="background-color: #f3f4f6;"></div>
        </button>
        <div class="collaborative-subtoolbar__divider"></div>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-border-width" data-tooltip="Grosor de borde" aria-label="Grosor de borde">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#straighten"></use></svg>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-spacing" data-tooltip="Espaciado de celdas" aria-label="Espaciado de celdas">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#space_dashboard"></use></svg>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-padding" data-tooltip="Relleno de celdas" aria-label="Relleno de celdas">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#aspect_ratio"></use></svg>
        </button>
        <div class="collaborative-subtoolbar__divider"></div>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-add-row" data-tooltip="Añadir fila" aria-label="Añadir fila">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-del-row" data-tooltip="Eliminar última fila" aria-label="Eliminar última fila">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#remove"></use></svg>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-add-col" data-tooltip="Añadir columna" aria-label="Añadir columna">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#view_column"></use></svg>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-table-del-col" data-tooltip="Eliminar última columna" aria-label="Eliminar última columna">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#view_stream"></use></svg>
        </button>
      </div>

      <div class="collaborative-context-group is-hidden" data-ref="context-group-chart">
        <button type="button" class="component-button component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-chart-edit-data" data-tooltip="Editar datos de gráfica" aria-label="Datos">
          <svg class="component-icon component-button__icon-left" aria-hidden="true"><use href="/icons.svg#table_chart"></use></svg>
          <span class="component-button__text">Datos</span>
        </button>
        <button type="button" class="component-button component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-chart-edit-style" data-tooltip="Personalizar gráfica" aria-label="Personalizar">
          <svg class="component-icon component-button__icon-left" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
          <span class="component-button__text">Personalizar</span>
        </button>
        <div class="collaborative-subtoolbar__divider"></div>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-chart-palette" data-tooltip="Cambiar paleta de colores" aria-label="Paleta">
          <span class="collaborative-color-picker-preview" data-ref="preview-chart-palette" style="background: linear-gradient(135deg, #3b82f6, #a855f7);"></span>
        </button>
      </div>

      <div class="collaborative-context-group is-hidden" data-ref="context-group-page">
        <span class="collaborative-context-badge" data-ref="txt-selected-page">Color de fondo:</span>
        <button type="button" class="collaborative-color-picker-btn" data-ref="btn-page-bg-color" data-tooltip="Color de fondo de página" aria-label="Color de fondo de página">
          <div class="collaborative-color-picker-preview" data-ref="preview-page-bg-color" style="background-color: #ffffff;"></div>
        </button>
      </div>

      <div class="collaborative-context-group" data-ref="context-group-actions">
        <div class="collaborative-subtoolbar__divider"></div>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--h36 collaborative-toolbar-btn" data-ref="btn-context-duplicate" data-tooltip="Duplicar" aria-label="Duplicar">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#content_copy"></use></svg>
        </button>
        <button type="button" class="component-button component-button--icon-only component-button--ghost component-button--danger component-button--h36 collaborative-toolbar-btn" data-ref="btn-context-delete" data-tooltip="Eliminar" aria-label="Eliminar">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
        </button>
      </div>
    </div>

    <main class="collaborative-workspace" data-ref="collaborative-workspace">
      <div class="collaborative-zoom-wrapper" data-ref="collaborative-zoom-wrapper">
        <div class="collaborative-pages-container" data-ref="pages-container"></div>
      </div>
    </main>
  </div>

  <footer class="collaborative-footer" data-ref="collaborative-footer">
    <div class="collaborative-footer__right" data-ref="footer-right">
      <span class="collaborative-footer__page-text" data-ref="txt-footer-page-info">1 de 1</span>
      <div class="collaborative-footer__divider"></div>
      <input class="collaborative-zoom-slider" data-ref="slider-zoom" type="range" min="10" max="300" step="1" value="100" style="--slider-pct: 31.03%;" aria-label="Nivel de zoom" />
      <button type="button" class="collaborative-zoom-level-btn" data-ref="btn-zoom-reset" data-tooltip="Restablecer zoom (100%)" aria-label="Restablecer zoom">
        <span data-ref="txt-zoom-level">100%</span>
      </button>
    </div>
  </footer>
</div>
