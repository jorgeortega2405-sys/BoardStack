<div class="login-container" data-ref="login-wrapper">
  <a class="login-header-logo" data-ref="login-home-link" href="/" data-i18n-aria="nav.go_home" data-i18n-title="app.name">
    <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="BoardPDF" />
  </a>

  <div class="card card--w-400" data-ref="login-card">
    <div class="auth-step" data-ref="login-step-main">
      <div class="card__header" data-ref="login-header">
        <h1 class="card__title" data-ref="login-title" data-i18n="auth.login.title"></h1>
        <p class="card__subtitle" data-ref="login-subtitle" data-i18n="auth.login.subtitle"></p>
      </div>

      <div class="card__body" data-ref="login-form">
        <label class="field" data-ref="field-login-email">
          <input class="field__input" data-ref="login-email" type="email" maxlength="254" placeholder=" " autocomplete="email" />
          <span class="field__label" data-ref="label-login-email" data-i18n="auth.login.email_label"></span>
        </label>

        <label class="field" data-ref="field-login-password">
          <input class="field__input field__input--has-action" data-ref="login-password" type="password" maxlength="128" placeholder=" " autocomplete="current-password" />
          <span class="field__label" data-ref="label-login-password" data-i18n="auth.login.password_label"></span>
          <button type="button" class="field__action" data-ref="toggle-login-password" data-i18n-tooltip="auth.login.show_password" data-i18n-aria="auth.login.toggle_password">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
          </button>
        </label>

        <div class="link-row" data-ref="login-forgot-row">
          <a class="link" data-ref="btn-forgot-password" href="/forgot-password" data-i18n="auth.login.forgot_password"></a>
        </div>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-login" data-i18n="auth.login.submit_btn">
        </button>

        <button type="button" class="component-button component-button--h55 component-button--outline component-button--w-full is-hidden" data-ref="btn-sso-login">
          <svg class="component-icon" style="font-size: 20px; margin-right: 8px;" aria-hidden="true"><use href="/icons.svg#vpn_key"></use></svg>
          <span class="component-button__text" data-ref="sso-btn-text" data-i18n="auth.login.sso_btn">Continuar con SSO</span>
        </button>

        <button type="button" class="component-button component-button--h55 component-button--w-full" data-ref="btn-google-login">
          <svg class="google-icon" data-ref="google-icon" width="20" height="20" aria-hidden="true"><use href="/icons.svg#google_colored"></use></svg>
          <span class="component-button__text" data-ref="google-btn-text" data-i18n="auth.login.google_btn"></span>
        </button>

        <div class="banner banner--danger" data-ref="login-error" style="display: none;"></div>

        <p class="footer-note" data-ref="login-footer">
          <span data-i18n="auth.login.no_account"></span> <a class="link link--primary" data-ref="btn-to-register" href="/register" data-i18n="auth.login.create_account"></a>
        </p>
      </div>
    </div>

    <div class="auth-step" data-ref="login-step-2fa" style="display: none;">
      <div class="card__header" data-ref="login-2fa-header">
        <h1 class="card__title" data-ref="login-2fa-title" data-i18n="auth.login_2fa.title"></h1>
        <p class="card__subtitle" data-ref="login-2fa-subtitle">
          <span data-ref="verify-2fa-subtitle-text" data-i18n="auth.login_2fa.subtitle"></span>
        </p>
      </div>

      <div class="card__body" data-ref="login-2fa-form">
        <label class="field" data-ref="field-login-2fa-code">
          <input class="field__input field__input--code" data-ref="input-login-2fa-code" type="text" maxlength="9" placeholder=" " autocomplete="one-time-code" />
          <span class="field__label" data-ref="label-login-2fa-code" data-i18n="auth.login_2fa.code_label"></span>
        </label>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-2fa" data-i18n="auth.login_2fa.submit_btn">
        </button>

        <div class="banner banner--danger" data-ref="login-2fa-error" style="display: none;"></div>

        <div class="link-row" data-ref="login-2fa-back-row" style="justify-content: center; margin-top: 14px;">
          <a class="link" data-ref="btn-back-to-login" href="/login" data-i18n="auth.login_2fa.back_to_login"></a>
        </div>
      </div>
    </div>

    <div class="auth-step" data-ref="login-step-desktop" style="display: none;">
      <div class="card__header" data-ref="login-desktop-header">
        <h1 class="card__title" data-ref="login-desktop-title" data-i18n="auth.login.desktop_title"></h1>
        <p class="card__subtitle" data-ref="login-desktop-subtitle" data-i18n="auth.login.desktop_subtitle"></p>
      </div>

      <div class="card__body" data-ref="login-desktop-form">
        <button type="button" class="component-button component-button--h55 component-button--w-full" data-ref="btn-desktop-google">
          <svg class="google-icon" data-ref="google-desktop-icon" width="20" height="20" aria-hidden="true"><use href="/icons.svg#google_colored"></use></svg>
          <span class="component-button__text" data-ref="google-desktop-btn-text" data-i18n="auth.login.desktop_google_btn"></span>
        </button>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-desktop-browser-email" style="margin-top: 12px;">
          <svg class="component-icon" style="font-size: 20px; margin-right: 8px;" aria-hidden="true"><use href="/icons.svg#mail"></use></svg>
          <span class="component-button__text" data-ref="email-desktop-btn-text" data-i18n="auth.login.desktop_email_btn"></span>
        </button>

        <div class="banner banner--danger" data-ref="login-desktop-error" style="display: none;"></div>

        <div class="link-row" data-ref="login-desktop-manual-row" style="justify-content: center; margin-top: 18px;">
          <button type="button" class="link" data-ref="btn-desktop-show-manual" data-i18n="auth.login.desktop_manual_link"></button>
        </div>
      </div>
    </div>

    <div class="auth-step" data-ref="login-step-browser-handoff" style="display: none;">
      <div class="card__header" data-ref="login-handoff-header">
        <h1 class="card__title" data-ref="login-handoff-title" data-i18n="auth.login.desktop_handoff_title"></h1>
        <p class="card__subtitle" data-ref="login-handoff-subtitle" data-i18n="auth.login.desktop_handoff_subtitle"></p>
      </div>

      <div class="card__body" data-ref="login-handoff-form" style="text-align: center;">
        <div class="handoff-icon-wrapper" data-ref="handoff-icon-wrapper" style="margin-bottom: 20px;">
          <svg class="component-icon" style="font-size: 56px; color: var(--color-brand, #e11d48);" aria-hidden="true"><use href="/icons.svg#devices"></use></svg>
        </div>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-launch-desktop-app" data-i18n="auth.login.desktop_handoff_btn">
        </button>

        <div class="link-row" data-ref="login-handoff-web-row" style="justify-content: center; margin-top: 16px;">
          <a class="link" data-ref="btn-handoff-continue-web" href="/" data-i18n="auth.login.desktop_handoff_web_link"></a>
        </div>
      </div>
    </div>
  </div>
</div>
