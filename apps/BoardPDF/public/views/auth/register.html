<div class="login-container" data-ref="register-wrapper">
  <a class="login-header-logo" data-ref="register-home-link" href="/" data-i18n-aria="nav.go_home" data-i18n-title="app.name">
    <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="BoardPDF" />
  </a>

  <div class="card card--w-400" data-ref="register-card">
    <div class="auth-step" data-ref="register-step-1">
      <div class="card__header" data-ref="register-header-1">
        <h1 class="card__title" data-ref="register-title-1" data-i18n="auth.register.title"></h1>
        <p class="card__subtitle" data-ref="register-subtitle-1" data-i18n="auth.register.subtitle"></p>
      </div>

      <div class="card__body" data-ref="register-form-1">
        <label class="field" data-ref="field-register-email">
          <input class="field__input" data-ref="register-email" type="email" maxlength="254" placeholder=" " autocomplete="email" />
          <span class="field__label" data-ref="label-register-email" data-i18n="auth.register.email_label"></span>
        </label>

        <label class="field" data-ref="field-register-password">
          <input class="field__input field__input--has-action" data-ref="register-password" type="password" maxlength="128" placeholder=" " autocomplete="new-password" />
          <span class="field__label" data-ref="label-register-password" data-i18n="auth.register.password_label"></span>
          <button type="button" class="field__action" data-ref="toggle-register-password" data-i18n-tooltip="auth.login.show_password" data-i18n-aria="auth.login.toggle_password">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
          </button>
        </label>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-stage1" data-i18n="auth.register.submit_btn">
        </button>

        <button type="button" class="component-button component-button--h55 component-button--w-full" data-ref="btn-google-register">
          <svg class="google-icon" data-ref="google-icon" width="20" height="20" aria-hidden="true"><use href="/icons.svg#google_colored"></use></svg>
          <span class="component-button__text" data-ref="google-btn-text" data-i18n="auth.register.google_btn"></span>
        </button>

        <div class="banner banner--danger" data-ref="register-error-stage1" style="display: none;"></div>

        <p class="footer-note" data-ref="register-footer-1">
          <span data-i18n="auth.register.have_account"></span> <a class="link link--primary" data-ref="btn-to-login" href="/login" data-i18n="auth.register.login_link"></a>
        </p>
      </div>
    </div>

    <div class="auth-step" data-ref="register-step-2" style="display: none;">
      <div class="card__header" data-ref="register-header-2">
        <h1 class="card__title" data-ref="register-title-2" data-i18n="auth.register_stage2.title"></h1>
        <p class="card__subtitle" data-ref="register-subtitle-2" data-i18n="auth.register_stage2.subtitle"></p>
      </div>

      <div class="card__body" data-ref="register-form-2">
        <label class="field" data-ref="field-register-username">
          <input class="field__input field__input--has-action" data-ref="register-username" type="text" maxlength="30" placeholder=" " autocomplete="username" />
          <span class="field__label" data-ref="label-register-username" data-i18n="auth.register_stage2.username_label"></span>
          <button type="button" class="field__action" data-ref="btn-random-username" data-i18n-tooltip="auth.register_stage2.random_username_tooltip" data-i18n-aria="auth.register_stage2.random_username_aria">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#auto_fix_high"></use></svg>
          </button>
        </label>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-stage2" data-i18n="auth.register_stage2.submit_btn">
        </button>

        <div class="banner banner--danger" data-ref="register-error-stage2" style="display: none;"></div>

        <div class="link-row" data-ref="stage2-back-row" style="justify-content: center; margin-top: 8px;">
          <a class="link" data-ref="btn-back-stage1" href="/register" data-i18n="auth.register_stage2.back_btn"></a>
        </div>
      </div>
    </div>

    <div class="auth-step" data-ref="register-step-3" style="display: none;">
      <div class="card__header" data-ref="register-header-3">
        <h1 class="card__title" data-ref="register-title-3" data-i18n="auth.register_stage3.title"></h1>
        <p class="card__subtitle" data-ref="register-subtitle-3">
          <span data-ref="verify-subtitle-text"></span>
        </p>
      </div>

      <div class="card__body" data-ref="register-form-3">
        <label class="field" data-ref="field-register-code">
          <input class="field__input field__input--code" data-ref="register-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="one-time-code" />
          <span class="field__label" data-ref="label-register-code" data-i18n="auth.register_stage3.code_label"></span>
        </label>

        <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-stage3" data-i18n="auth.register_stage3.submit_btn">
        </button>

        <button type="button" class="component-button component-button--h40 component-button--ghost component-button--w-full" data-ref="btn-resend-code" data-i18n="auth.register_stage3.resend_btn">
        </button>

        <div class="banner banner--danger" data-ref="register-error-stage3" style="display: none;"></div>
        <div class="banner banner--success" data-ref="register-success-stage3" style="display: none;"></div>

        <div class="link-row" data-ref="stage3-back-row" style="justify-content: center; margin-top: 8px;">
          <a class="link" data-ref="btn-restart-register" href="/register" data-i18n="auth.register_stage3.restart_btn"></a>
        </div>
      </div>
    </div>
  </div>
</div>
