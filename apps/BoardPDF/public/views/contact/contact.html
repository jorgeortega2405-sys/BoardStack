<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="contact-wrapper">
  <div class="view-backdrop view-backdrop--dots" data-ref="contact-backdrop"></div>
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="contact-scrollable">
    <div class="view-body" data-ref="contact-view">
      <header class="view-section" data-ref="header-section">
        <div class="component-block component-block--compact" data-ref="header-bar">
          <a class="brand-logo" data-ref="brand-logo" href="/" aria-label="BoardPDF">
            <span class="brand-wordmark" data-ref="brand-wordmark">Board<span class="brand-accent" data-ref="brand-accent">PDF</span></span>
          </a>
        </div>
      </header>

      <section class="view-section" data-ref="contact-hero-section">
        <div class="component-block" data-ref="contact-hero">
          <div class="view-hero__content" data-ref="contact-hero-content">
            <div class="component-badge component-badge--sm" data-ref="contact-badge">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#support_agent"></use></svg>
              <span data-ref="contact-badge-text" data-i18n="contact.badge"></span>
            </div>
            <h1 class="view-hero__title" data-ref="contact-title" data-i18n="contact.title"></h1>
            <p class="view-hero__subtitle" data-ref="contact-subtitle" data-i18n="contact.subtitle"></p>
          </div>
        </div>
      </section>

      <section class="view-section" data-ref="contact-content-section">
        <div class="contact-container" data-ref="contact-container">
          <div class="component-block" data-ref="contact-card-form">
            <h2 class="contact-card__title" data-ref="contact-form-title" data-i18n="contact.form_title"></h2>
            <p class="contact-card__desc" data-ref="contact-form-desc" data-i18n="contact.form_desc"></p>

            <form class="contact-form" data-ref="contact-form">
              <label class="field" data-ref="field-contact-name">
                <input class="field__input" data-ref="contact-name" type="text" placeholder=" " required autocomplete="name" />
                <span class="field__label" data-i18n="contact.name_label"></span>
              </label>

              <label class="field" data-ref="field-contact-email">
                <input class="field__input" data-ref="contact-email" type="email" placeholder=" " required autocomplete="email" />
                <span class="field__label" data-i18n="contact.email_label"></span>
              </label>

              <div class="settings-dropdown-wrapper settings-dropdown-wrapper--full" data-ref="dropdown-wrapper-contact-subject">
                <button type="button" class="dropdown-trigger" data-ref="btn-trigger-contact-subject" data-i18n-aria="contact.subject_aria" aria-label=" ">
                  <div class="dropdown-trigger__left">
                    <svg class="component-icon dropdown-trigger__icon" data-ref="icon-contact-subject" aria-hidden="true"><use href="/icons.svg#help"></use></svg>
                    <span class="dropdown-trigger__text" data-ref="contact-subject-selected-text" data-i18n="contact.subject_placeholder"></span>
                  </div>
                  <svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-contact-subject">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="dropdown-menu-contact-subject">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-contact-subject" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list" data-ref="list-contact-subject">
                      <button type="button" class="menu-item" data-ref="option-subject-technical" data-value="technical">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#build"></use></svg>
                        <span class="menu-item__text" data-i18n="contact.subject_technical"></span>
                      </button>
                      <button type="button" class="menu-item" data-ref="option-subject-billing" data-value="billing">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#credit_card"></use></svg>
                        <span class="menu-item__text" data-i18n="contact.subject_billing"></span>
                      </button>
                      <button type="button" class="menu-item" data-ref="option-subject-bug" data-value="bug">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#warning"></use></svg>
                        <span class="menu-item__text" data-i18n="contact.subject_bug"></span>
                      </button>
                      <button type="button" class="menu-item" data-ref="option-subject-suggestion" data-value="suggestion">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#auto_awesome"></use></svg>
                        <span class="menu-item__text" data-i18n="contact.subject_suggestion"></span>
                      </button>
                      <button type="button" class="menu-item" data-ref="option-subject-security" data-value="security">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#shield"></use></svg>
                        <span class="menu-item__text" data-i18n="contact.subject_security"></span>
                      </button>
                      <button type="button" class="menu-item" data-ref="option-subject-enterprise" data-value="enterprise">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#groups"></use></svg>
                        <span class="menu-item__text" data-i18n="contact.subject_enterprise"></span>
                      </button>
                    </div>
                  </div>
                </div>
                <input class="hidden-field" data-ref="contact-subject" type="hidden" value="" />
              </div>

              <label class="field field--textarea" data-ref="field-contact-message">
                <textarea class="field__input field__textarea" data-ref="contact-message" placeholder=" " rows="5" required></textarea>
                <span class="field__label" data-i18n="contact.message_label"></span>
              </label>

              <div class="turnstile-container" data-ref="contact-turnstile-container"></div>

              <button type="submit" class="component-button component-button--primary component-button--h44 component-button--w-full" data-ref="btn-submit-contact">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#mail"></use></svg>
                <span data-i18n="contact.submit_btn"></span>
              </button>

              <div class="banner banner--danger is-hidden" data-ref="contact-error"></div>
              <div class="banner banner--success is-hidden" data-ref="contact-success"></div>
            </form>
          </div>

          <div class="component-block is-hidden" data-ref="contact-card-ticket">
            <div class="contact-ticket-header" data-ref="ticket-header">
              <div class="contact-ticket-header__meta" data-ref="ticket-header-meta">
                <span class="contact-ticket-tag" data-ref="ticket-number">#TK-0000-0000</span>
                <span class="contact-ticket-status-badge" data-ref="ticket-status-badge" data-i18n="contact.ticket_open"></span>
              </div>
              <h2 class="contact-card__title" data-ref="ticket-title" data-i18n="contact.ticket_loading"></h2>
              <p class="contact-card__desc" data-ref="ticket-meta-desc"><span data-i18n="contact.ticket_author_prefix"></span> <strong data-ref="ticket-author">...</strong></p>
            </div>

            <div class="contact-ticket-conversation" data-ref="ticket-messages-list"></div>

            <form class="contact-ticket-reply-form" data-ref="ticket-reply-form">
              <label class="field field--textarea" data-ref="field-ticket-reply-message">
                <textarea class="field__input field__textarea" data-ref="ticket-reply-message" placeholder=" " rows="4" required></textarea>
                <span class="field__label" data-i18n="contact.reply_label"></span>
              </label>
              <div class="contact-ticket-reply-actions" data-ref="ticket-reply-actions">
                <button type="submit" class="component-button component-button--primary component-button--h44" data-ref="btn-submit-ticket-reply">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#send"></use></svg>
                  <span data-i18n="contact.reply_submit_btn"></span>
                </button>
                <a class="component-button component-button--secondary component-button--h44" data-ref="btn-new-ticket" data-i18n="contact.new_ticket_btn" href="/contact"></a>
              </div>
              <div class="banner banner--danger is-hidden" data-ref="ticket-reply-error"></div>
              <div class="banner banner--success is-hidden" data-ref="ticket-reply-success"></div>
            </form>

            <div class="banner banner--info is-hidden" data-ref="ticket-closed-notice">
              <span data-i18n="contact.ticket_closed_notice_1"></span> <a class="link" data-ref="link-new-ticket" data-i18n="contact.ticket_closed_link" href="/contact"></a><span data-i18n="contact.ticket_closed_notice_2"></span>
            </div>
          </div>

          <div class="contact-sidebar" data-ref="contact-sidebar">
            <div class="component-block" data-ref="contact-info-card">
              <div class="contact-info-item" data-ref="contact-item-support">
                <div class="contact-info-icon-box" data-ref="contact-icon-support">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#support_agent"></use></svg>
                </div>
                <div class="contact-info-content" data-ref="contact-content-support">
                  <h3 class="contact-info-title" data-ref="contact-title-support" data-i18n="contact.support_title"></h3>
                  <a class="contact-info-link" data-ref="contact-link-support" href="mailto:soporte@boardpdf.app">soporte@boardpdf.app</a>
                  <p class="contact-info-text" data-ref="contact-desc-support" data-i18n="contact.support_desc"></p>
                </div>
              </div>

              <div class="contact-info-item" data-ref="contact-item-privacy">
                <div class="contact-info-icon-box" data-ref="contact-icon-privacy">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#shield"></use></svg>
                </div>
                <div class="contact-info-content" data-ref="contact-content-privacy">
                  <h3 class="contact-info-title" data-ref="contact-title-privacy" data-i18n="contact.privacy_title"></h3>
                  <a class="contact-info-link" data-ref="contact-link-privacy" href="mailto:privacidad@boardpdf.app">privacidad@boardpdf.app</a>
                  <p class="contact-info-text" data-ref="contact-desc-privacy" data-i18n="contact.privacy_desc"></p>
                </div>
              </div>
            </div>

            <div class="component-block" data-ref="contact-faq-card">
              <h3 class="contact-card__title" data-ref="contact-faq-title" data-i18n="contact.faq_title"></h3>
              <p class="contact-card__desc" data-ref="contact-faq-desc" data-i18n="contact.faq_desc"></p>
              <a class="component-button component-button--secondary component-button--h44 component-button--w-full" data-ref="btn-contact-to-faq" data-i18n="contact.faq_btn" data-navigate="/help/faq" href="/help/faq"></a>
            </div>
          </div>
        </div>
      </section>

      <footer class="view-section" data-ref="contact-footer-section"></footer>
    </div>
  </div>
</div>
