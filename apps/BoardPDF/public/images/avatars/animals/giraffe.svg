<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" rx="50" fill="#FEF3C7"/>
  <!-- Ossicones (Horns) -->
  <line x1="42" y1="28" x2="40" y2="16" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <circle cx="39" cy="15" r="4" fill="#78350F"/>
  <line x1="58" y1="28" x2="60" y2="16" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <circle cx="61" cy="15" r="4" fill="#78350F"/>
  <!-- Ears -->
  <ellipse cx="24" cy="34" rx="10" ry="5" fill="#FBBF24" transform="rotate(-25 24 34)"/>
  <ellipse cx="76" cy="34" rx="10" ry="5" fill="#FBBF24" transform="rotate(25 76 34)"/>
  <!-- Head -->
  <ellipse cx="50" cy="54" rx="27" ry="28" fill="#FCD34D"/>
  <!-- Spots -->
  <ellipse cx="40" cy="36" rx="4" ry="3" fill="#B45309"/>
  <ellipse cx="60" cy="37" rx="3.5" ry="4" fill="#B45309"/>
  <ellipse cx="50" cy="44" rx="3" ry="3" fill="#B45309"/>
  <!-- Eyes -->
  <circle cx="37" cy="49" r="3.5" fill="#1E293B"/>
  <circle cx="38.5" cy="47.5" r="1.3" fill="#FFFFFF"/>
  <circle cx="63" cy="49" r="3.5" fill="#1E293B"/>
  <circle cx="64.5" cy="47.5" r="1.3" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <circle cx="28" cy="62" r="4" fill="#FDA4AF" opacity="0.6"/>
  <circle cx="72" cy="62" r="4" fill="#FDA4AF" opacity="0.6"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="67" rx="15" ry="11" fill="#FEF08A"/>
  <!-- Nostrils & Smile -->
  <ellipse cx="45" cy="63" rx="2" ry="1.2" fill="#78350F"/>
  <ellipse cx="55" cy="63" rx="2" ry="1.2" fill="#78350F"/>
  <path d="M46 69 Q50 73 54 69" stroke="#78350F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>