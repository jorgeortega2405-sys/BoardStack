  <ellipse cx="20" cy="50" rx="8" ry="18" fill="#B45309" transform="rotate(20 20 50)"/>
  <ellipse cx="80" cy="50" rx="8" ry="18" fill="#B45309" transform="rotate(-20 80 50)"/>
  <!-- Head -->
  <circle cx="50" cy="55" r="31" fill="#FBBF24"/>
  <!-- Eye Patch -->
  <ellipse cx="37" cy="49" rx="10" ry="11" fill="#D97706" opacity="0.4"/>
  <!-- Eyes -->
  <circle cx="37" cy="49" r="4" fill="#1E293B"/>
