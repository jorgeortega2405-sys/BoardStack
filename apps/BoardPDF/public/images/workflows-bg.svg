<svg xmlns="http://www.w3.org/2000/svg" width="158" height="180" viewBox="0 0 158 180" fill="none">
  <defs>
    <linearGradient id="wf-card-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="wf-card-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Ambient Workflow Canvas Grid -->
  <g opacity="0.5">
    <circle cx="68" cy="20" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="86" cy="20" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="104" cy="20" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="122" cy="20" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="20" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="68" cy="38" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="38" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="50" cy="56" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="68" cy="56" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="56" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="32" cy="74" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="50" cy="74" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="68" cy="74" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="74" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="32" cy="92" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="50" cy="92" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="92" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="32" cy="110" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="110" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="32" cy="128" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="50" cy="128" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="68" cy="128" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="32" cy="146" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="50" cy="146" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="68" cy="146" r="1.2" fill="#111827" fill-opacity="0.22"/>

    <circle cx="32" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="50" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="68" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="86" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="104" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="122" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
    <circle cx="140" cy="164" r="1.2" fill="#111827" fill-opacity="0.22"/>
  </g>

  <!-- Connectors / Pipelines -->
  <!-- Main Vertical Trunk -->
  <path d="M 111 58 V 72" stroke="#111827" stroke-width="1.5" stroke-opacity="0.32" stroke-linecap="round"/>
  <path d="M 111 92 V 114" stroke="#111827" stroke-width="1.5" stroke-opacity="0.32" stroke-linecap="round"/>
  
  <!-- Direction Chevron on Main Path -->
  <path d="M 108.5 101 L 111 103.5 L 113.5 101" stroke="#111827" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45"/>

  <!-- Secondary Flow Curve (Branching to Left) -->
  <path d="M 97 82 C 76 82, 57 93, 57 116" stroke="#111827" stroke-width="1.3" stroke-dasharray="3 2.5" stroke-opacity="0.28" stroke-linecap="round"/>
  <path d="M 64 97 L 61.5 101 L 65.5 102.5" stroke="#111827" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.38"/>

  <!-- Step 1: Input / Trigger Node (Top Right) -->
  <g>
    <rect x="78" y="14" width="66" height="44" rx="8" fill="url(#wf-card-grad-2)" stroke="#111827" stroke-width="1.2" stroke-opacity="0.24"/>
    <!-- Icon Box -->
    <rect x="85" y="21" width="13" height="13" rx="3.5" fill="#111827" fill-opacity="0.12"/>
    <!-- Document / Play Glyph -->
    <path d="M 89.5 25 L 94 27.5 L 89.5 30 Z" fill="#111827" fill-opacity="0.65"/>
    <!-- Placeholder Lines -->
    <rect x="103" y="24" width="31" height="3" rx="1.5" fill="#111827" fill-opacity="0.35"/>
    <rect x="103" y="30" width="20" height="2.5" rx="1.25" fill="#111827" fill-opacity="0.2"/>
    <!-- Tag Pill -->
    <rect x="85" y="39" width="38" height="10" rx="3.5" fill="#111827" fill-opacity="0.06"/>
    <rect x="90" y="43" width="26" height="2" rx="1" fill="#111827" fill-opacity="0.28"/>
    <!-- Port Out -->
    <circle cx="111" cy="58" r="3.5" fill="#ffffff" stroke="#111827" stroke-width="1.4" stroke-opacity="0.45"/>
    <circle cx="111" cy="58" r="1.5" fill="#111827" fill-opacity="0.75"/>
  </g>

  <!-- Step Operator / Action Pill (Center) -->
  <g>
    <rect x="94" y="69" width="34" height="26" rx="13" fill="#111827" fill-opacity="0.04"/>
    <rect x="97" y="72" width="28" height="20" rx="10" fill="url(#wf-card-grad-2)" stroke="#111827" stroke-width="1.2" stroke-opacity="0.28"/>
    <!-- Lightning / Action Symbol -->
    <path d="M 112 76.5 L 108 82 H 111.5 L 110 87.5 L 114.5 81.5 H 111 Z" fill="#111827" fill-opacity="0.75"/>
  </g>

  <!-- Branch Node (Step Left) -->
  <g>
    <rect x="36" y="116" width="42" height="36" rx="7" fill="url(#wf-card-grad-1)" stroke="#111827" stroke-width="1.1" stroke-opacity="0.2"/>
    <!-- Port In -->
    <circle cx="57" cy="116" r="3" fill="#ffffff" stroke="#111827" stroke-width="1.3" stroke-opacity="0.4"/>
    <circle cx="57" cy="116" r="1.2" fill="#111827" fill-opacity="0.65"/>
    <!-- Icon & Lines -->
    <rect x="42" y="124" width="8" height="8" rx="2" fill="#111827" fill-opacity="0.1"/>
    <rect x="54" y="125" width="18" height="2.5" rx="1.25" fill="#111827" fill-opacity="0.3"/>
    <rect x="54" y="130" width="12" height="2" rx="1" fill="#111827" fill-opacity="0.18"/>
    <rect x="42" y="138" width="30" height="2.2" rx="1.1" fill="#111827" fill-opacity="0.12"/>
  </g>

  <!-- Step 2: Output Node (Bottom Right) -->
  <g>
    <rect x="82" y="114" width="68" height="48" rx="8" fill="url(#wf-card-grad-2)" stroke="#111827" stroke-width="1.2" stroke-opacity="0.26"/>
    <!-- Port In -->
    <circle cx="111" cy="114" r="3.5" fill="#ffffff" stroke="#111827" stroke-width="1.4" stroke-opacity="0.45"/>
    <circle cx="111" cy="114" r="1.5" fill="#111827" fill-opacity="0.75"/>
    <!-- Success Badge -->
    <circle cx="94" cy="133" r="6.5" fill="#111827" fill-opacity="0.12"/>
    <path d="M 91.5 133 L 93.3 135 L 96.8 131" stroke="#111827" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
    <!-- Placeholder Lines -->
    <rect x="105" y="129" width="35" height="3" rx="1.5" fill="#111827" fill-opacity="0.35"/>
    <rect x="105" y="135" width="24" height="2.5" rx="1.25" fill="#111827" fill-opacity="0.2"/>
    <!-- Progress Pill -->
    <rect x="90" y="148" width="52" height="3.5" rx="1.75" fill="#111827" fill-opacity="0.08"/>
    <rect x="90" y="148" width="40" height="3.5" rx="1.75" fill="#111827" fill-opacity="0.35"/>
  </g>

  <!-- Modern Floating Accent Particles -->
  <!-- 4-point star accent -->
  <path d="M 148 68 C 148 70, 149.2 71.2, 151.2 71.2 C 149.2 71.2, 148 72.4, 148 74.4 C 148 72.4, 146.8 71.2, 144.8 71.2 C 146.8 71.2, 148 70, 148 68 Z" fill="#111827" fill-opacity="0.32"/>
  <!-- Mini star accent -->
  <path d="M 48 39 C 48 40.2, 48.8 41, 50 41 C 48.8 41, 48 41.8, 48 43 C 48 41.8, 47.2 41, 46 41 C 47.2 41, 48 40.2, 48 39 Z" fill="#111827" fill-opacity="0.25"/>
  <!-- Ring pulse -->
  <circle cx="145" cy="100" r="2.5" stroke="#111827" stroke-width="0.9" stroke-opacity="0.22" fill="none"/>
</svg>
