services:
  s3:
    image: andrewgaul/s3proxy:latest
    container_name: boardpdf-s3
    ports:
      - "9000:80"
    environment:
      S3PROXY_AUTHORIZATION: none
      S3PROXY_IDENTITY: ${AWS_S3_ACCESS_KEY_ID:-minioadmin}
      S3PROXY_CREDENTIAL: ${AWS_S3_SECRET_ACCESS_KEY:-minioadmin}
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    volumes:
      - s3_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: boardpdf-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-boardpdf_db}
      MYSQL_USER: ${DB_USER:-boardpdf_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-boardpdf_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_super_secure_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_super_secure_2026}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boardpdf-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: boardpdf-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: BoardPDFTelemetry
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s

  cassandra-init:
    image: cassandra:4.1
    container_name: boardpdf-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./database/cassandra/init.cql:/init.cql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Applying Cassandra telemetry schema..."
        cqlsh cassandra 9042 -f /init.cql
        echo "Cassandra telemetry schema ready."
    restart: "no"

  telemetry-worker:
    build:
      context: ./apps/BoardPDF
      dockerfile: Dockerfile.telemetry-worker
    container_name: boardpdf-telemetry-worker
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-boardpdf_telemetry}
      CASSANDRA_USER: ${CASSANDRA_USER:-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-}
      TELEMETRY_STREAM_KEY: ${TELEMETRY_STREAM_KEY:-telemetry:events:stream}
      TELEMETRY_DLQ_STREAM_KEY: ${TELEMETRY_DLQ_STREAM_KEY:-telemetry:events:dlq}
      TELEMETRY_CONSUMER_GROUP: ${TELEMETRY_CONSUMER_GROUP:-telemetry-cassandra-workers}
      TELEMETRY_WORKER_BATCH_SIZE: ${TELEMETRY_WORKER_BATCH_SIZE:-250}
      TELEMETRY_WORKER_BLOCK_MS: ${TELEMETRY_WORKER_BLOCK_MS:-1000}
    restart: unless-stopped

  storage-cleaner:
    build:
      context: ./apps/BoardPDF
      dockerfile: Dockerfile.cleaner
    container_name: boardpdf-storage-cleaner
    depends_on:
      s3:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AWS_S3_ENDPOINT: http://s3:80
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-boardpdf-storage}
      AWS_S3_FORCE_PATH_STYLE: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-boardpdf_user}
      DB_PASSWORD: ${DB_PASSWORD:-boardpdf_secure_password_2026}
      DB_NAME: ${DB_NAME:-boardpdf_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLEANER_INTERVAL_SECONDS: 60
      RETENTION_SECONDS: 3600
    restart: unless-stopped

  token-reset-worker:
    build:
      context: ./apps/BoardPDF
      dockerfile: Dockerfile.token-worker
    container_name: boardpdf-token-reset-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-boardpdf_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-boardpdf_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TOKEN_RESET_INTERVAL_SECONDS: 60
      TOKEN_RESET_BATCH_SIZE: 1000
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/BoardPDF/Dockerfile
    container_name: boardpdf-app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      collab:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-boardpdf_user}
      DB_PASSWORD: ${DB_PASSWORD:-boardpdf_secure_password_2026}
      DB_NAME: ${DB_NAME:-boardpdf_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-boardpdf_telemetry}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_SERVICE_NAME: ${TELEMETRY_SERVICE_NAME:-boardpdf-api}
      TELEMETRY_STREAM_KEY: ${TELEMETRY_STREAM_KEY:-telemetry:events:stream}
      AWS_S3_ENDPOINT: http://s3:80
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-boardpdf-storage}
      AWS_S3_FORCE_PATH_STYLE: "true"
    restart: unless-stopped

  collab:
    build:
      context: .
      dockerfile: apps/BoardPDF/collab-server/Dockerfile
    container_name: boardpdf-collab
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MAX_COLLABORATORS: 12
    restart: always

volumes:
  s3_data:
  mysql_data:
  redis_data:
  cassandra_data:
